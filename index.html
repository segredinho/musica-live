<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Live Player - Canvas & Synced Lyrics</title>

<!-- Estilos e Fontes -->
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
background-color: #050505;
color: #ffffff;
overflow: hidden;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
}

/* Canvas 3D de Fundo */
#bg-canvas {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: 1;
}

/* Interface Principal */
.player-container {
position: relative;
z-index: 2;
width: 90%;
max-width: 900px;
height: 80vh;
display: grid;
grid-template-columns: 1fr 1.2fr;
gap: 30px;
background: rgba(18, 18, 18, 0.65);
backdrop-filter: blur(25px);
-webkit-backdrop-filter: blur(25px);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 24px;
padding: 35px;
box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
}

/* Lado Esquerdo: Capa e Info */
.track-info {
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
}

.album-cover {
width: 260px;
height: 260px;
border-radius: 16px;
object-fit: cover;
box-shadow: 0 15px 35px rgba(0,0,0,0.6);
margin-bottom: 25px;
transition: transform 0.3s ease;
}

.album-cover:hover {
transform: scale(1.03);
}

.track-title {
font-size: 1.5rem;
font-weight: 700;
margin-bottom: 8px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
max-width: 100%;
}

.track-artist {
font-size: 1rem;
color: #b3b3b3;
}

/* Lado Direito: Container de Letras */
.lyrics-container {
overflow-y: auto;
padding-right: 15px;
display: flex;
flex-direction: column;
gap: 18px;
scroll-behavior: smooth;
mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
-webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
}

.lyrics-container::-webkit-scrollbar {
width: 4px;
}

.lyrics-container::-webkit-scrollbar-thumb {
background: rgba(255, 255, 255, 0.2);
border-radius: 4px;
}

.lyric-line {
font-size: 1.25rem;
font-weight: 600;
color: rgba(255, 255, 255, 0.35);
transition: color 0.3s ease, transform 0.3s ease, filter 0.3s ease;
cursor: pointer;
filter: blur(0.5px);
}

.lyric-line.active {
color: #1db954;
font-size: 1.45rem;
transform: scale(1.02);
filter: blur(0);
}

/* Responsividade */
@media (max-width: 768px) {
.player-container {
grid-template-columns: 1fr;
height: 90vh;
overflow-y: auto;
}
.album-cover {
width: 180px;
height: 180px;
}
}
</style>

<!-- Import de Bibliotecas via CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<!-- Canvas do Fundo Interativo -->
<canvas id="bg-canvas"></canvas>

<!-- Interface de Usuário -->
<div class="player-container">
<div class="track-info">
<img id="album-cover" class="album-cover" src="https://via.placeholder.com/300/121212/FFFFFF?text=Spotify" alt="Capa do Álbum">
<div id="track-title" class="track-title">Aguardando Música...</div>
<div id="track-artist" class="track-artist">Faça login e toque algo no Spotify</div>
</div>

<div id="lyrics-container" class="lyrics-container">
<div class="lyric-line active">As letras sincronizadas aparecerão aqui...</div>
</div>
</div>

<script>
/* =========================================================================
1. EFETO VISUAL 3D DE PARTICULAS (THREE.JS)
========================================================================= */
const canvas = document.getElementById('bg-canvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

// Geometria das Partículas
const particlesCount = 1200;
const positions = new Float32Array(particlesCount * 3);
const colors = new Float32Array(particlesCount * 3);

for (let i = 0; i < particlesCount * 3; i++) {
positions[i] = (Math.random() - 0.5) * 10;
colors[i] = Math.random();
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
size: 0.035,
vertexColors: true,
transparent: true,
opacity: 0.8
});

const particlesMesh = new THREE.Points(geometry, material);
scene.add(particlesMesh);
camera.position.z = 3;

// Velocidade padrão reativa
let pulseSpeed = 0.002;

function animate() {
requestAnimationFrame(animate);
particlesMesh.rotation.y += pulseSpeed;
particlesMesh.rotation.x += pulseSpeed * 0.5;
renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================================
2. BUSCA DE LETRAS SINCRONIZADAS (LRCLIB API)
========================================================================= */
let currentLyrics = [];
let activeLyricIndex = -1;

async function fetchLyrics(track, artist, album, duration) {
const container = document.getElementById('lyrics-container');
container.innerHTML = '<div class="lyric-line">Buscando letra...</div>';

try {
const url = `https://lrclib.net/api/get?track_name=${encodeURIComponent(track)}&artist_name=${encodeURIComponent(artist)}&album_name=${encodeURIComponent(album)}&duration=${Math.round(duration)}`;
const res = await fetch(url);

if (!res.ok) throw new Error("Letra não encontrada");

const data = await res.json();

if (data.syncedLyrics) {
parseAndRenderLrc(data.syncedLyrics);
} else {
container.innerHTML = '<div class="lyric-line">Letra sincronizada não disponível.</div>';
}
} catch (err) {
container.innerHTML = '<div class="lyric-line">Letra indisponível para esta faixa.</div>';
}
}

function parseAndRenderLrc(lrcText) {
const lines = lrcText.split('\n');
currentLyrics = [];
const container = document.getElementById('lyrics-container');
container.innerHTML = '';

lines.forEach((line, idx) => {
const match = line.match(/\[(\d{2}):(\d{2}\.\d{2})\](.*)/);
if (match) {
const time = parseInt(match[1]) * 60 + parseFloat(match[2]);
const text = match[3].trim();
if (text) {
currentLyrics.push({ time, text });

const div = document.createElement('div');
div.className = 'lyric-line';
div.id = `lyric-${currentLyrics.length - 1}`;
div.innerText = text;
container.appendChild(div);
}
}
});
}

function updateLyricsDisplay(progressSeconds) {
if (!currentLyrics.length) return;

let newIndex = -1;
for (let i = currentLyrics.length - 1; i >= 0; i--) {
if (progressSeconds >= currentLyrics[i].time) {
newIndex = i;
break;
}
}

if (newIndex !== -1 && newIndex !== activeLyricIndex) {
if (activeLyricIndex !== -1) {
const prevEl = document.getElementById(`lyric-${activeLyricIndex}`);
if (prevEl) prevEl.classList.remove('active');
}

const activeEl = document.getElementById(`lyric-${newIndex}`);
if (activeEl) {
activeEl.classList.add('active');
activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
activeLyricIndex = newIndex;
}
}

/* =========================================================================
3. INTEGRAÇÃO COM PLAYER OAUTH / SPOTIFY (MOCK DE DEMO)
========================================================================= */
// Substitua pelas chamadas do seu token de acesso OAuth do Spotify
function syncPlayerState(trackData) {
document.getElementById('album-cover').src = trackData.albumCover;
document.getElementById('track-title').innerText = trackData.name;
document.getElementById('track-artist').innerText = trackData.artist;

// Aumenta a velocidade do fundo 3D baseado na energia da música
pulseSpeed = 0.005;

fetchLyrics(trackData.name, trackData.artist, trackData.album, trackData.durationSec);
}
</script>
</body>
</html>
