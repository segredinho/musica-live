<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Live Player - Spotify Auto Sync</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;background:#05050b;color:#fff}
body{display:flex;align-items:center;justify-content:center}
.player{
position:relative;width:min(100vw,720px);height:100vh;max-height:1280px;overflow:hidden;
background:
radial-gradient(circle at 50% 25%,rgba(44,90,255,.32),transparent 30%),
radial-gradient(circle at 15% 75%,rgba(255,0,153,.22),transparent 28%),
radial-gradient(circle at 85% 65%,rgba(0,224,255,.20),transparent 28%),
linear-gradient(160deg,#070812 0%,#0a0b18 45%,#03030a 100%);
}

/* Efeito de Tremor do Grave (Paredão) */
.player.shake-enabled.playing {
  animation: bassShake var(--bpm-speed, 0.52s) infinite;
}

@keyframes bassShake {
  0% { transform: translate(0, 0) rotate(0deg); }
  15% { transform: translate(-3px, 2px) rotate(-0.5deg); }
  30% { transform: translate(3px, -2px) rotate(0.5deg); }
  45% { transform: translate(-4px, -1px) rotate(-0.8deg); }
  60% { transform: translate(4px, 2px) rotate(0.8deg); }
  75% { transform: translate(-2px, 1px) rotate(-0.3deg); }
  100% { transform: translate(0, 0) rotate(0deg); }
}

.player:before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 180deg,transparent,#1d42ff22,transparent,#ff18b322,transparent);filter:blur(50px);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.grid{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:42px 42px;transform:perspective(500px) rotateX(58deg) scale(1.7);transform-origin:bottom;top:45%}
.top{position:absolute;top:26px;left:28px;right:28px;display:flex;align-items:center;justify-content:space-between;z-index:3}
.live{display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:1.5px;font-size:17px}
.dot{width:11px;height:11px;border-radius:50%;background:#ff315d;box-shadow:0 0 18px #ff315d;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(.65);opacity:.55}}

/* Botões da Barra Superior */
.top-actions{display:flex;gap:8px;align-items:center}
.badge-btn{
padding:8px 14px;border:1px solid #ffffff25;border-radius:999px;
background:#ffffff0b;backdrop-filter:blur(14px);font-size:11px;
color:#b9c7ff;font-weight:700;cursor:pointer;transition:all .2s ease;
display:inline-flex;align-items:center;gap:6px;
}
.badge-btn:hover{background:#ffffff1f;border-color:#ffffff44;color:#fff}
.badge-btn.connect-btn{border-color:#1ed76088;background:#061a0cdd;color:#1ed760}
.badge-btn.connect-btn:hover{background:#0a2914;color:#fff}
.badge-btn.disconnect-btn{border-color:#ff315d88;background:#2a060cdd;color:#ff315d;display:none}
.badge-btn.disconnect-btn:hover{background:#420812;color:#fff}

.center{position:absolute;top:12%;left:0;right:0;text-align:center;z-index:2}
.title{font-size:19px;letter-spacing:5px;color:#b7c5ff;font-weight:700}
.subtitle{margin-top:6px;font-size:13px;color:#7f8bb0}

/* Efeito Paredão: Estrutura Principal de Batida */
.disc-wrap{
position:relative;width:350px;height:350px;margin:35px auto 25px;
animation:subwooferKick var(--bpm-speed, 0.52s) ease-in-out infinite alternate;
animation-play-state: paused;
}
@keyframes subwooferKick {
  0% { transform: scale(0.98); }
  50% { transform: scale(1.02); }
  100% { transform: scale(1.09); }
}

.glow{
position:absolute;inset:10px;border-radius:50%;
background:linear-gradient(45deg,var(--c1, #00eaff),var(--c2, #6c4dff),var(--c3, #ff27bc));
filter:blur(25px);opacity:.7;transition:background 1.5s ease;
animation:glowBass var(--bpm-speed, 0.52s) ease-in-out infinite alternate;
animation-play-state: paused;
}
@keyframes glowBass {
  0% { filter: blur(20px); opacity: 0.5; transform: scale(0.95); }
  100% { filter: blur(45px); opacity: 0.95; transform: scale(1.18); }
}

.disc{position:absolute;inset:25px;border-radius:50%;background:repeating-radial-gradient(circle,#090a10 0 7px,#161923 8px 10px);border:2px solid #ffffff16;box-shadow:0 0 50px #294dff66, inset 0 0 40px #000;animation:record 7s linear infinite}
@keyframes record{to{transform:rotate(360deg)}}
.disc:before{content:"";position:absolute;inset:43%;border-radius:50%;background:linear-gradient(135deg,var(--c1, #00eaff),var(--c2, #6b5cff) 55%,var(--c3, #ff2ac3));box-shadow:0 0 30px #00eaff88;transition:background 1.5s ease}
.disc:after{content:"♫";position:absolute;left:0;right:0;top:44%;text-align:center;font-size:29px;font-weight:900;color:white;z-index:2}

/* Visualizer "Grave de Paredão" */
.visualizer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4px;z-index:3}
.bar{width:4px;border-radius:10px;background:linear-gradient(var(--c1, #00eaff),var(--c2, #7c4dff),var(--c3, #ff35c8));box-shadow:0 0 12px #4c6cff;animation:bars calc(var(--bpm-speed, 0.52s) * 0.8) ease-in-out infinite alternate;transition:background 1.5s ease}
.bar:nth-child(1){height:38px;animation-delay:.02s}.bar:nth-child(2){height:62px;animation-delay:.08s}.bar:nth-child(3){height:85px;animation-delay:.15s}.bar:nth-child(4){height:55px;animation-delay:.05s}.bar:nth-child(5){height:95px;animation-delay:.20s}.bar:nth-child(6){height:65px;animation-delay:.12s}.bar:nth-child(7){height:42px;animation-delay:.18s}
@keyframes bars{
  0%{transform:scaleY(0.2);opacity:.4}
  100%{transform:scaleY(1.35);opacity:1;filter:brightness(1.3);}
}

.track{position:absolute;top:58%;left:38px;right:38px;z-index:3}
.trackname{font-size:27px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:14px;color:#8e99bb;margin-top:5px}
.progress{margin-top:19px;height:6px;border-radius:20px;background:#ffffff18;overflow:hidden}
.fill{width:0%;height:100%;background:linear-gradient(90deg,var(--c1, #00eaff),var(--c2, #6d55ff),var(--c3, #ff32bf));box-shadow:0 0 15px #5b6dff;transition:width 0.3s ease, background 1.5s ease}
.times{display:flex;justify-content:space-between;margin-top:8px;color:#747e9e;font-size:11px}

/* Seção Inferior com Animações Divertidas */
.bottom{position:absolute;left:28px;right:28px;bottom:28px;z-index:3}
.effects-card{
border:1px solid #ffffff18;background:#ffffff08;backdrop-filter:blur(18px);
border-radius:20px;padding:16px 18px;text-align:center;
}
.effects-title{
font-size:11px;font-weight:800;letter-spacing:1.5px;color:#aeb9d8;
margin-bottom:12px;text-transform:uppercase;
}
.effects-btns{display:flex;gap:10px;justify-content:center}
.anim-btn{
flex:1;padding:10px 14px;border-radius:14px;border:1px solid #ffffff20;
background:rgba(255,255,255,0.06);color:#fff;font-size:13px;font-weight:700;
cursor:pointer;transition:all .2s ease;display:flex;align-items:center;
justify-content:center;gap:6px;box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
.anim-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,0.15)}
.anim-btn.rose{border-color:#ff336655;color:#ff6688}
.anim-btn.rose:hover{background:#ff336622;box-shadow:0 0 20px #ff336644}
.anim-btn.bolt{border-color:#00eaff55;color:#00eaff}
.anim-btn.bolt:hover{background:#00eaff22;box-shadow:0 0 20px #00eaff44}
.anim-btn.money{border-color:#1ed76055;color:#1ed760}
.anim-btn.money:hover{background:#1ed76022;box-shadow:0 0 20px #1ed76044}

/* Container de Partículas e Flash de Raio */
.particle-container{
position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden;
}
.particle{
position:absolute;top:-50px;font-size:26px;user-select:none;
animation:fall linear forwards;
}
@keyframes fall{
0%{transform:translateY(0) rotate(0deg);opacity:1}
100%{transform:translateY(110vh) rotate(360deg);opacity:0}
}
.lightning-flash{
position:absolute;inset:0;background:#ffffff;opacity:0;pointer-events:none;z-index:9;
}
.lightning-active{
animation:flashAnim 0.4s ease-out;
}
@keyframes flashAnim{
0%{opacity:0.8}20%{opacity:0.1}40%{opacity:0.6}100%{opacity:0}
}

@media(max-width:520px){.disc-wrap{transform:scale(.82);margin-top:10px;margin-bottom:-15px}.center{top:9%}.track{top:57%}.trackname{font-size:22px}.top{left:18px;right:18px}.bottom{left:18px;right:18px}.effects-btns{flex-direction:column;gap:6px}}

/* Painel de Configuração */
.edit-panel{
position:absolute;inset:0;z-index:20;display:none;
align-items:center;justify-content:center;
background:#02030acc;backdrop-filter:blur(12px);
}
.edit-panel.show{display:flex}
.edit-box{
width:min(88%,440px);padding:25px;border-radius:24px;
background:linear-gradient(145deg,#11162a,#080b16);
border:1px solid #ffffff1c;box-shadow:0 20px 80px #000;
}
.edit-title{font-size:22px;font-weight:900;color:#1ed760}
.edit-subtitle{color:#7f8bad;font-size:12px;margin:6px 0 18px;line-height:1.4}
.edit-box label{display:block;margin:12px 0 6px;color:#b8c3df;font-size:12px;font-weight:700}
.edit-box input{
width:100%;padding:12px 14px;border-radius:12px;
border:1px solid #ffffff18;background:#ffffff09;color:#fff;
outline:none;font-size:13px;
}
.edit-box input:focus{border-color:#1ed76088;box-shadow:0 0 15px #1ed76018}
.edit-actions{display:flex;gap:10px;margin-top:22px}
.edit-actions button{
flex:1;padding:13px;border-radius:12px;font-weight:800;
font-size:12px;cursor:pointer;
}
.cancel{background:#ffffff0c;border:1px solid #ffffff15;color:#aab4d0}
.save{background:#1ed760;border:0;color:#000}

/* Painel Secreto de Controle de BPM (Ativado pela Tecla 'B') */
.secret-bpm-panel{
position:fixed;bottom:15px;right:15px;z-index:100;
background:rgba(10, 14, 28, 0.94);backdrop-filter:blur(16px);
border:1px solid rgba(255, 255, 255, 0.2);border-radius:16px;
padding:14px 18px;box-shadow:0 10px 30px rgba(0,0,0,0.8);
display:none;flex-direction:column;gap:10px;width:260px;
color:#fff;font-size:12px;
}
.secret-bpm-panel.active{display:flex}
.bpm-header{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:#00eaff}
.bpm-controls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bpm-btn{
padding:8px;border-radius:8px;border:1px solid #ffffff25;
background:#ffffff10;color:#fff;font-weight:700;cursor:pointer;
transition:all 0.2s ease;text-align:center;font-size:11px;
}
.bpm-btn:hover{background:#00eaff33;border-color:#00eaff}
.toggle-shake-btn{
grid-column: span 2;
margin-top: 4px;
background: #ff315d22;
border-color: #ff315d88;
color: #ff6688;
}
.toggle-shake-btn:hover{background:#ff315d44;border-color:#ff315d}

/* Fundo Dinâmico Que Muda com a Música */
.dynamic-bg{position:absolute;inset:-20%;z-index:0;opacity:0;transition:opacity 0.8s ease}
.dynamic-bg.active{opacity:.85}
.dynamic-bg:before,.dynamic-bg:after{content:"";position:absolute;border-radius:50%;filter:blur(80px);transition:background 1.5s ease}
.dynamic-bg:before{width:60%;height:60%;left:0%;top:10%;background:radial-gradient(circle, var(--c1, #00eaff88), var(--c2, #7c4dff44));animation:orb1 6s ease-in-out infinite alternate}
.dynamic-bg:after{width:55%;height:55%;right:0%;bottom:5%;background:radial-gradient(circle, var(--c3, #ff24c488), var(--c1, #1e57ff44));animation:orb2 8s ease-in-out infinite alternate}
@keyframes orb1{0%{transform:translate(10%,10%) scale(1)}100%{transform:translate(35%,30%) scale(1.3)}}
@keyframes orb2{0%{transform:translate(-10%,-10%) scale(1)}100%{transform:translate(-30%,-25%) scale(1.25)}}

.bg-ambient-cover{
position:absolute;inset:-10%;background-size:cover;background-position:center;
filter:blur(60px) brightness(0.45);opacity:0;z-index:0;transition:opacity 1s ease, background-image 1.5s ease;
transform:scale(1.1);
}
.bg-ambient-cover.active{opacity:.45}
.bg-ambient-cover.playing{animation:pulseBg var(--bpm-speed, 0.52s) ease-in-out infinite alternate}
@keyframes pulseBg{0%{transform:scale(1.05)}100%{transform:scale(1.2)}}

.album-art{position:absolute;inset:72px;border-radius:50%;background-size:cover;background-position:center;opacity:.25;filter:saturate(1.3);mix-blend-mode:screen;z-index:1;transition:background-image 0.8s ease}
</style>
</head>
<body>
<div class="player shake-enabled" id="player">
<div class="bg-ambient-cover" id="bgAmbientCover"></div>
<div class="dynamic-bg" id="dynamicBg"></div>
<div class="lightning-flash" id="lightningFlash"></div>
<div class="particle-container" id="particleContainer"></div>
<div class="grid"></div>

<div class="top">
<div class="live"><i class="dot"></i> LIVE MUSIC</div>
<div class="top-actions">
  <button class="badge-btn" id="bgToggleBtn">✨ FUNDO: ON</button>
  <button class="badge-btn connect-btn" id="connectNavBtn">🎧 CONECTAR SPOTIFY</button>
  <button class="badge-btn disconnect-btn" id="disconnectNavBtn">❌ DESCONECTAR</button>
  <button class="badge-btn" id="openConfigBtn">⚙ ID</button>
</div>
</div>

<div class="center">
<div class="title">MUSIC LIVE PLAYER</div>
<div class="subtitle" id="statusSub">Aguardando conexão com o Spotify...</div>

<div class="disc-wrap" id="discWrap">
<div class="glow" id="glowAnim"></div>
<div class="album-art" id="albumArt"></div>
<div class="disc" id="discAnim"></div>
<div class="visualizer" id="visualizerAnim">
<i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i>
<i class="bar"></i><i class="bar"></i><i class="bar"></i>
</div>
</div>
</div>

<div class="track">
<div class="trackname" id="trackName">Nenhuma música tocando</div>
<div class="artist" id="artist">Conecte sua conta do Spotify</div>

<div class="progress"><div class="fill" id="fill"></div></div>
<div class="times"><span id="current">00:00</span><span id="duration">00:00</span></div>
</div>

<div class="bottom">
<div class="effects-card">
<div class="effects-title">✨ ANIMAÇÕES DIVERTIDAS DA LIVE</div>
<div class="effects-btns">
  <button class="anim-btn rose" onclick="triggerEffect('rose')">🌹 Rosas</button>
  <button class="anim-btn bolt" onclick="triggerEffect('bolt')">⚡ Raios</button>
  <button class="anim-btn money" onclick="triggerEffect('money')">💰 Dinheiro</button>
</div>
</div>
</div>
</div>

<!-- Painel Secreto de Controle de BPM e Tremor -->
<div class="secret-bpm-panel" id="secretBpmPanel">
  <div class="bpm-header">
    <span>🔊 CONTROLE DE BPM</span>
    <span id="bpmValueDisplay">115 BPM</span>
  </div>
  <div class="bpm-controls">
    <button class="bpm-btn" onclick="setBPM(0.70, '85 BPM')">Lento</button>
    <button class="bpm-btn" onclick="setBPM(0.52, '115 BPM')">Normal</button>
    <button class="bpm-btn" onclick="setBPM(0.38, '155 BPM')">Apressado</button>
    <button class="bpm-btn" onclick="setBPM(0.25, '240 BPM')">Mega Grave</button>
    <button class="bpm-btn toggle-shake-btn" id="toggleShakeBtn" onclick="toggleShake()">📴 Tremor: ON</button>
  </div>
</div>

<div class="edit-panel" id="editPanel">
<div class="edit-box">
<div class="edit-title">⚙ Configurar Client ID</div>
<div class="edit-subtitle">Insira o seu <b>Client ID</b> do aplicativo cadastrado no Spotify Developer Dashboard.</div>

<label>Client ID do App Spotify</label>
<input id="clientIdInput" type="text" placeholder="Cole seu Client ID aqui">

<div class="edit-actions">
<button id="cancelConfig" class="cancel">Cancelar</button>
<button id="saveClientIdBtn" class="save">Salvar Client ID</button>
</div>
</div>
</div>

<script>
const SCOPES = 'user-read-currently-playing user-read-playback-state';

const openConfigBtn = document.getElementById('openConfigBtn');
const editPanel = document.getElementById('editPanel');
const cancelConfig = document.getElementById('cancelConfig');
const clientIdInput = document.getElementById('clientIdInput');
const saveClientIdBtn = document.getElementById('saveClientIdBtn');

const connectNavBtn = document.getElementById('connectNavBtn');
const disconnectNavBtn = document.getElementById('disconnectNavBtn');

const bgToggleBtn = document.getElementById('bgToggleBtn');
const dynamicBg = document.getElementById('dynamicBg');
const bgAmbientCover = document.getElementById('bgAmbientCover');
const playerEl = document.getElementById('player');

const trackName = document.getElementById('trackName');
const artist = document.getElementById('artist');
const albumArt = document.getElementById('albumArt');
const fill = document.getElementById('fill');
const current = document.getElementById('current');
const duration = document.getElementById('duration');
const statusSub = document.getElementById('statusSub');
const discAnim = document.getElementById('discAnim');
const discWrap = document.getElementById('discWrap');
const glowAnim = document.getElementById('glowAnim');
const visualizerBars = document.querySelectorAll('.bar');

let currentTrackId = null;
let isShakeActive = true;

/* Alternar Tremor do Grave */
function toggleShake() {
  isShakeActive = !isShakeActive;
  const shakeBtn = document.getElementById('toggleShakeBtn');
  
  if (isShakeActive) {
    playerEl.classList.add('shake-enabled');
    shakeBtn.textContent = '📴 Tremor: ON';
    shakeBtn.style.color = '#ff6688';
  } else {
    playerEl.classList.remove('shake-enabled');
    shakeBtn.textContent = '📴 Tremor: OFF';
    shakeBtn.style.color = '#aab4d0';
  }
}

/* Controle Secreto de BPM */
function setBPM(speedSec, textLabel) {
  playerEl.style.setProperty('--bpm-speed', speedSec + 's');
  document.getElementById('bpmValueDisplay').textContent = textLabel;
}

/* Atalhos de Teclado Secretos */
document.addEventListener('keydown', e => {
  // Pressionar a tecla 'B' ou 'b' abre/fecha o painel secreto
  if (e.key === 'b' || e.key === 'B') {
    const panel = document.getElementById('secretBpmPanel');
    panel.classList.toggle('active');
  }
  
  if (e.key === 'F11') { 
    e.preventDefault(); 
    document.documentElement.requestFullscreen?.(); 
  }
});

/* Extração Automática de Cores da Capa do Álbum */
function updateColorsFromImage(imgUrl) {
  const img = new Image();
  img.crossOrigin = "Anonymous";
  img.src = imgUrl;

  img.onload = () => {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 50;
    canvas.height = 50;
    ctx.drawImage(img, 0, 0, 50, 50);

    const imgData = ctx.getImageData(0, 0, 50, 50).data;
    let r1 = 0, g1 = 0, b1 = 0;
    let count = 0;

    for (let i = 0; i < imgData.length; i += 16) {
      r1 += imgData[i];
      g1 += imgData[i + 1];
      b1 += imgData[i + 2];
      count++;
    }

    r1 = Math.floor(r1 / count);
    g1 = Math.floor(g1 / count);
    b1 = Math.floor(b1 / count);

    let r2 = (r1 + 80) % 255, g2 = (g1 + 40) % 255, b2 = (b1 + 120) % 255;
    let r3 = (r1 + 150) % 255, g3 = (g1 + 100) % 255, b3 = (b1 + 50) % 255;

    playerEl.style.setProperty('--c1', `rgb(${r1}, ${g1}, ${b1})`);
    playerEl.style.setProperty('--c2', `rgb(${r2}, ${g2}, ${b2})`);
    playerEl.style.setProperty('--c3', `rgb(${r3}, ${g3}, ${b3})`);
  };
}

/* Função para Disparar Efeitos Visuais */
function triggerEffect(type) {
  const container = document.getElementById('particleContainer');
  
  if (type === 'bolt') {
    const flash = document.getElementById('lightningFlash');
    flash.classList.remove('lightning-active');
    void flash.offsetWidth;
    flash.classList.add('lightning-active');
  }

  const items = {
    rose: ['🌹', '🌸', '🌺', '🥀'],
    bolt: ['⚡', '🌩️', '✨', '⚡'],
    money: ['💰', '💵', '💸', '🤑']
  };

  const selectedList = items[type] || ['✨'];
  const count = type === 'bolt' ? 22 : 30;

  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.classList.add('particle');
      el.textContent = selectedList[Math.floor(Math.random() * selectedList.length)];
      el.style.left = Math.random() * 92 + '%';
      
      const durationSec = (Math.random() * 1.8 + 1.2).toFixed(2);
      const sizePx = Math.floor(Math.random() * 18 + 22);
      
      el.style.fontSize = sizePx + 'px';
      el.style.animationDuration = durationSec + 's';
      
      container.appendChild(el);
      setTimeout(() => el.remove(), durationSec * 1000);
    }, i * 65);
  }
}

let isDynamicBgEnabled = localStorage.getItem('dynamic_bg_enabled') !== 'false';

function applyDynamicBgState() {
  if (isDynamicBgEnabled) {
    bgToggleBtn.innerHTML = '✨ FUNDO: ON';
    dynamicBg.classList.add('active');
    bgAmbientCover.classList.add('active');
  } else {
    bgToggleBtn.innerHTML = '✨ FUNDO: OFF';
    dynamicBg.classList.remove('active');
    bgAmbientCover.classList.remove('active');
  }
}

bgToggleBtn.onclick = () => {
  isDynamicBgEnabled = !isDynamicBgEnabled;
  localStorage.setItem('dynamic_bg_enabled', isDynamicBgEnabled);
  applyDynamicBgState();
};

function updateUIState() {
  const token = localStorage.getItem('spotify_access_token');
  if (token) {
    connectNavBtn.style.display = 'none';
    disconnectNavBtn.style.display = 'inline-flex';
  } else {
    connectNavBtn.style.display = 'inline-flex';
    disconnectNavBtn.style.display = 'none';
  }
}

openConfigBtn.onclick = () => {
  clientIdInput.value = localStorage.getItem('spotify_client_id') || '';
  editPanel.classList.add('show');
};
cancelConfig.onclick = () => editPanel.classList.remove('show');

saveClientIdBtn.onclick = () => {
  const clientId = clientIdInput.value.trim();
  if (!clientId) {
    alert('Por favor, insira o seu Client ID.');
    return;
  }
  localStorage.setItem('spotify_client_id', clientId);
  editPanel.classList.remove('show');
  alert('Client ID salvo com sucesso!');
};

function logoutSpotify() {
  localStorage.removeItem('spotify_access_token');
  localStorage.removeItem('spotify_refresh_token');
  localStorage.removeItem('spotify_code_verifier');

  trackName.textContent = 'Nenhuma música tocando';
  artist.textContent = 'Conecte sua conta do Spotify';
  statusSub.textContent = 'Clique em "CONECTAR SPOTIFY" para autorizar';
  albumArt.style.backgroundImage = 'none';
  bgAmbientCover.style.backgroundImage = 'none';
  fill.style.width = '0%';
  current.textContent = '00:00';
  duration.textContent = '00:00';
  currentTrackId = null;

  setPlaybackState(false);
  updateUIState();
}

disconnectNavBtn.onclick = logoutSpotify;

function generateRandomString(length) {
  let text = '';
  let possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  for (let i = 0; i < length; i++) {
    text += possible.charAt(Math.floor(Math.random() * possible.length));
  }
  return text;
}

async function generateCodeChallenge(codeVerifier) {
  const data = new TextEncoder().encode(codeVerifier);
  const digest = await window.crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

connectNavBtn.onclick = async () => {
  let clientId = localStorage.getItem('spotify_client_id');
  if (!clientId) {
    openConfigBtn.click();
    alert('Por favor, configure o seu Client ID primeiro.');
    return;
  }

  const verifier = generateRandomString(128);
  const challenge = await generateCodeChallenge(verifier);
  localStorage.setItem('spotify_code_verifier', verifier);

  const redirectUri = window.location.href.split('?')[0].split('#')[0];

  const params = new URLSearchParams({
    client_id: clientId,
    response_type: 'code',
    redirect_uri: redirectUri,
    scope: SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge
  });

  window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
};

function fmt(ms) {
  let totalSec = Math.floor(ms / 1000);
  let m = Math.floor(totalSec / 60);
  let s = Math.floor(totalSec % 60);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function setPlaybackState(isPlaying) {
  const state = isPlaying ? 'running' : 'paused';
  discAnim.style.animationPlayState = state;
  discWrap.style.animationPlayState = state;
  glowAnim.style.animationPlayState = state;
  visualizerBars.forEach(b => b.style.animationPlayState = state);

  if (isPlaying) {
    bgAmbientCover.classList.add('playing');
    playerEl.classList.add('playing');
  } else {
    bgAmbientCover.classList.remove('playing');
    playerEl.classList.remove('playing');
  }
}

async function handleSpotifyCallback() {
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');
  if (!code) return;

  const clientId = localStorage.getItem('spotify_client_id');
  const verifier = localStorage.getItem('spotify_code_verifier');
  const redirectUri = window.location.href.split('?')[0].split('#')[0];

  try {
    const response = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: clientId,
        grant_type: 'authorization_code',
        code: code,
        redirect_uri: redirectUri,
        code_verifier: verifier
      })
    });

    const data = await response.json();
    if (data.access_token) {
      localStorage.setItem('spotify_access_token', data.access_token);
      if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
      window.history.replaceState({}, document.title, redirectUri);
    }
  } catch (e) {
    console.error('Erro na autenticação:', e);
  }
}

async function refreshAccessToken() {
  const refreshToken = localStorage.getItem('spotify_refresh_token');
  const clientId = localStorage.getItem('spotify_client_id');
  if (!refreshToken || !clientId) return null;

  try {
    const response = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: clientId,
        grant_type: 'refresh_token',
        refresh_token: refreshToken
      })
    });
    const data = await response.json();
    if (data.access_token) {
      localStorage.setItem('spotify_access_token', data.access_token);
      if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
      return data.access_token;
    }
  } catch (e) {
    console.error('Erro ao atualizar token:', e);
  }
  return null;
}

async function fetchCurrentlyPlaying() {
  let token = localStorage.getItem('spotify_access_token');
  if (!token) {
    statusSub.textContent = 'Clique em "CONECTAR SPOTIFY" para iniciar';
    setPlaybackState(false);
    updateUIState();
    return;
  }

  updateUIState();

  try {
    let res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
      headers: { Authorization: `Bearer ${token}` }
    });

    if (res.status === 401) {
      token = await refreshAccessToken();
      if (!token) {
        logoutSpotify();
        return;
      }
      res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
        headers: { Authorization: `Bearer ${token}` }
      });
    }

    if (res.status === 204 || res.status > 400) {
      trackName.textContent = 'Nenhuma música tocando';
      artist.textContent = 'Abra o app do Spotify e dê play';
      fill.style.width = '0%';
      current.textContent = '00:00';
      duration.textContent = '00:00';
      setPlaybackState(false);
      return;
    }

    const data = await res.json();
    if (!data || !data.item) return;

    trackName.textContent = data.item.name;
    artist.textContent = data.item.artists.map(a => a.name).join(', ') + ' • Spotify';
    statusSub.textContent = 'Sincronizado ao vivo com Spotify';

    if (data.item.id !== currentTrackId) {
      currentTrackId = data.item.id;
      if (data.item.album && data.item.album.images.length > 0) {
        const coverUrl = data.item.album.images[0].url;
        albumArt.style.backgroundImage = `url("${coverUrl}")`;
        bgAmbientCover.style.backgroundImage = `url("${coverUrl}")`;
        updateColorsFromImage(coverUrl);
      }
    }

    const progressMs = data.progress_ms || 0;
    const durationMs = data.item.duration_ms || 1;
    const pct = Math.min(100, (progressMs / durationMs) * 100);

    fill.style.width = pct + '%';
    current.textContent = fmt(progressMs);
    duration.textContent = fmt(durationMs);

    setPlaybackState(data.is_playing);

  } catch (err) {
    console.error('Erro ao buscar dados do Spotify:', err);
  }
}

(async () => {
  applyDynamicBgState();
  await handleSpotifyCallback();
  fetchCurrentlyPlaying();
  setInterval(fetchCurrentlyPlaying, 3000);
})();
</script>
