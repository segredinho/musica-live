<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Live Player - Spotify Auto Sync</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;background:#05050b;color:#fff}
body{display:flex;align-items:center;justify-content:center}
.player{
position:relative;width:min(100vw,720px);height:100vh;max-height:1280px;overflow:hidden;
background:
radial-gradient(circle at 50% 25%,rgba(44,90,255,.32),transparent 30%),
radial-gradient(circle at 15% 75%,rgba(255,0,153,.22),transparent 28%),
radial-gradient(circle at 85% 65%,rgba(0,224,255,.20),transparent 28%),
linear-gradient(160deg,#070812 0%,#0a0b18 45%,#03030a 100%);
}
.player:before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 180deg,transparent,#1d42ff22,transparent,#ff18b322,transparent);filter:blur(50px);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.grid{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:42px 42px;transform:perspective(500px) rotateX(58deg) scale(1.7);transform-origin:bottom;top:45%}
.top{position:absolute;top:26px;left:28px;right:28px;display:flex;align-items:center;justify-content:space-between;z-index:3}
.live{display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:1.5px;font-size:17px}
.dot{width:11px;height:11px;border-radius:50%;background:#ff315d;box-shadow:0 0 18px #ff315d;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(.65);opacity:.55}}

/* Botões da Barra Superior Integrada */
.top-actions{display:flex;gap:8px;align-items:center}
.badge-btn{
padding:8px 14px;border:1px solid #ffffff25;border-radius:999px;
background:#ffffff0b;backdrop-filter:blur(14px);font-size:11px;
color:#b9c7ff;font-weight:700;cursor:pointer;transition:all .2s ease;
display:inline-flex;align-items:center;gap:6px;
}
.badge-btn:hover{background:#ffffff1f;border-color:#ffffff44;color:#fff}
.badge-btn.connect-btn{border-color:#1ed76088;background:#061a0cdd;color:#1ed760}
.badge-btn.connect-btn:hover{background:#0a2914;color:#fff}
.badge-btn.disconnect-btn{border-color:#ff315d88;background:#2a060cdd;color:#ff315d;display:none}
.badge-btn.disconnect-btn:hover{background:#420812;color:#fff}

.center{position:absolute;top:12%;left:0;right:0;text-align:center;z-index:2}
.title{font-size:19px;letter-spacing:5px;color:#b7c5ff;font-weight:700}
.subtitle{margin-top:6px;font-size:13px;color:#7f8bb0}
.disc-wrap{position:relative;width:350px;height:350px;margin:35px auto 25px}
.glow{position:absolute;inset:10px;border-radius:50%;background:linear-gradient(45deg,#00eaff,#6c4dff,#ff27bc);filter:blur(25px);opacity:.7}
.disc{position:absolute;inset:25px;border-radius:50%;background:repeating-radial-gradient(circle,#090a10 0 7px,#161923 8px 10px);border:2px solid #ffffff16;box-shadow:0 0 50px #294dff66, inset 0 0 40px #000;animation:record 7s linear infinite}
@keyframes record{to{transform:rotate(360deg)}}
.disc:before{content:"";position:absolute;inset:43%;border-radius:50%;background:linear-gradient(135deg,#00eaff,#6b5cff 55%,#ff2ac3);box-shadow:0 0 30px #00eaff88}
.disc:after{content:"♫";position:absolute;left:0;right:0;top:44%;text-align:center;font-size:29px;font-weight:900;color:white;z-index:2}
.visualizer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4px;z-index:3}
.bar{width:4px;border-radius:10px;background:linear-gradient(#00eaff,#7c4dff,#ff35c8);box-shadow:0 0 12px #4c6cff;animation:bars .7s ease-in-out infinite alternate}
.bar:nth-child(1){height:38px}.bar:nth-child(2){height:62px;animation-delay:.08s}.bar:nth-child(3){height:85px;animation-delay:.15s}.bar:nth-child(4){height:55px;animation-delay:.21s}.bar:nth-child(5){height:95px;animation-delay:.28s}.bar:nth-child(6){height:65px;animation-delay:.34s}.bar:nth-child(7){height:42px;animation-delay:.42s}
@keyframes bars{to{transform:scaleY(.25);opacity:.55}}
.track{position:absolute;top:58%;left:38px;right:38px;z-index:3}
.trackname{font-size:27px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:14px;color:#8e99bb;margin-top:5px}
.progress{margin-top:19px;height:6px;border-radius:20px;background:#ffffff18;overflow:hidden}
.fill{width:0%;height:100%;background:linear-gradient(90deg,#00eaff,#6d55ff,#ff32bf);box-shadow:0 0 15px #5b6dff;transition:width 0.3s ease}
.times{display:flex;justify-content:space-between;margin-top:8px;color:#747e9e;font-size:11px}

/* Nova Seção de Efeitos na Parte Inferior */
.bottom{position:absolute;left:28px;right:28px;bottom:28px;z-index:3}
.effects-card{
border:1px solid #ffffff18;background:#ffffff08;backdrop-filter:blur(18px);
border-radius:20px;padding:16px 18px;text-align:center;
}
.effects-title{
font-size:11px;font-weight:800;letter-spacing:1.5px;color:#aeb9d8;
margin-bottom:12px;text-transform:uppercase;
}
.effects-btns{display:flex;gap:10px;justify-content:center}
.anim-btn{
flex:1;padding:10px 14px;border-radius:14px;border:1px solid #ffffff20;
background:rgba(255,255,255,0.06);color:#fff;font-size:13px;font-weight:700;
cursor:pointer;transition:all .2s ease;display:flex;align-items:center;
justify-content:center;gap:6px;box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
.anim-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,0.15)}
.anim-btn.rose{border-color:#ff336655;color:#ff6688}
.anim-btn.rose:hover{background:#ff336622;box-shadow:0 0 20px #ff336644}
.anim-btn.bolt{border-color:#00eaff55;color:#00eaff}
.anim-btn.bolt:hover{background:#00eaff22;box-shadow:0 0 20px #00eaff44}
.anim-btn.money{border-color:#1ed76055;color:#1ed760}
.anim-btn.money:hover{background:#1ed76022;box-shadow:0 0 20px #1ed76044}

/* Overlay para os Elementos Caírem/Animarem */
.particle-container{
position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden;
}
.particle{
position:absolute;top:-50px;font-size:26px;user-select:none;
animation:fall linear forwards;
}
@keyframes fall{
0%{transform:translateY(0) rotate(0deg);opacity:1}
100%{transform:translateY(110vh) rotate(360deg);opacity:0}
}
.lightning-flash{
position:absolute;inset:0;background:#ffffff;opacity:0;pointer-events:none;z-index:9;
}
.lightning-active{
animation:flashAnim 0.4s ease-out;
}
@keyframes flashAnim{
0%{opacity:0.8}20%{opacity:0.1}40%{opacity:0.6}100%{opacity:0}
}

@media(max-width:520px){.disc-wrap{transform:scale(.82);margin-top:10px;margin-bottom:-15px}.center{top:9%}.track{top:57%}.trackname{font-size:22px}.top{left:18px;right:18px}.bottom{left:18px;right:18px}.effects-btns{flex-direction:column;gap:6px}}

/* Painel de Configurações */
.edit-panel{
position:absolute;inset:0;z-index:20;display:none;
align-items:center;justify-content:center;
background:#02030acc;backdrop-filter:blur(12px);
}
.edit-panel.show{display:flex}
.edit-box{
width:min(88%,440px);padding:25px;border-radius:24px;
background:linear-gradient(145deg,#11162a,#080b16);
border:1px solid #ffffff1c;box-shadow:0 20px 80px #000;
}
.edit-title{font-size:22px;font-weight:900;color:#1ed760}
.edit-subtitle{color:#7f8bad;font-size:12px;margin:6px 0 18px;line-height:1.4}
.edit-box label{display:block;margin:12px 0 6px;color:#b8c3df;font-size:12px;font-weight:700}
.edit-box input{
width:100%;padding:12px 14px;border-radius:12px;
border:1px solid #ffffff18;background:#ffffff09;color:#fff;
outline:none;font-size:13px;
}
.edit-box input:focus{border-color:#1ed76088;box-shadow:0 0 15px #1ed76018}
.edit-actions{display:flex;gap:10px;margin-top:22px}
.edit-actions button{
flex:1;padding:13px;border-radius:12px;font-weight:800;
font-size:12px;cursor:pointer;
}
.cancel{background:#ffffff0c;border:1px solid #ffffff15;color:#aab4d0}
.save{background:#1ed760;border:0;color:#000}

/* Fundo Dinâmico Animado */
.dynamic-bg{position:absolute;inset:-20%;z-index:0;opacity:0;transition:opacity 0.8s ease}
.dynamic-bg.active{opacity:.85}
.dynamic-bg:before,.dynamic-bg:after{content:"";position:absolute;border-radius:50%;filter:blur(75px)}
.dynamic-bg:before{width:60%;height:60%;left:0%;top:10%;background:radial-gradient(circle,#00eaff88,#7c4dff44);animation:orb1 6s ease-in-out infinite alternate}
.dynamic-bg:after{width:55%;height:55%;right:0%;bottom:5%;background:radial-gradient(circle,#ff24c488,#1e57ff44);animation:orb2 8s ease-in-out infinite alternate}
@keyframes orb1{0%{transform:translate(10%,10%) scale(1)}100%{transform:translate(35%,30%) scale(1.3)}}
@keyframes orb2{0%{transform:translate(-10%,-10%) scale(1)}100%{transform:translate(-30%,-25%) scale(1.25)}}

.bg-ambient-cover{
position:absolute;inset:-10%;background-size:cover;background-position:center;
filter:blur(60px) brightness(0.5);opacity:0;z-index:0;transition:opacity 1s ease;
transform:scale(1.1);
}
.bg-ambient-cover.active{opacity:.4}
.bg-ambient-cover.playing{animation:pulseBg 3s ease-in-out infinite alternate}
@keyframes pulseBg{0%{transform:scale(1.05)}100%{transform:scale(1.18)}}

.album-art{position:absolute;inset:72px;border-radius:50%;background-size:cover;background-position:center;opacity:.25;filter:saturate(1.3);mix-blend-mode:screen;z-index:1;transition:background-image 0.5s ease}
</style>
</head>
<body>
<div class="player" id="player">
<div class="bg-ambient-cover" id="bgAmbientCover"></div>
<div class="dynamic-bg" id="dynamicBg"></div>
<div class="lightning-flash" id="lightningFlash"></div>
<div class="particle-container" id="particleContainer"></div>
<div class="grid"></div>

<div class="top">
<div class="live"><i class="dot"></i> LIVE MUSIC</div>
<div class="top-actions">
  <button class="badge-btn" id="bgToggleBtn">✨ FUNDO DINÂMICO</button>
  <button class="badge-btn connect-btn" id="connectNavBtn">🎧 CONECTAR SPOTIFY</button>
  <button class="badge-btn disconnect-btn" id="disconnectNavBtn">❌ DESCONECTAR</button>
  <button class="badge-btn" id="openConfigBtn">⚙ ID</button>
</div>
</div>

<div class="center">
<div class="title">MUSIC LIVE PLAYER</div>
<div class="subtitle" id="statusSub">Aguardando conexão com o Spotify...</div>

<div class="disc-wrap">
<div class="glow"></div>
<div class="album-art" id="albumArt"></div>
<div class="disc" id="discAnim"></div>
<div class="visualizer" id="visualizerAnim">
<i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i>
<i class="bar"></i><i class="bar"></i><i class="bar"></i>
</div>
</div>
</div>

<div class="track">
<div class="trackname" id="trackName">Nenhuma música tocando</div>
<div class="artist" id="artist">Conecte sua conta do Spotify</div>

<div class="progress"><div class="fill" id="fill"></div></div>
<div class="times"><span id="current">00:00</span><span id="duration">00:00</span></div>
</div>

<div class="bottom">
<div class="effects-card">
<div class="effects-title">✨ ANIMAÇÕES DIVERTIDAS DA LIVE</div>
<div class="effects-btns">
  <button class="anim-btn rose" onclick="triggerEffect('rose')">🌹 Rosas</button>
  <button class="anim-btn bolt" onclick="triggerEffect('bolt')">⚡ Raios</button>
  <button class="anim-btn money" onclick="triggerEffect('money')">💰 Dinheiro</button>
</div>
</div>
</div>
</div>

<div class="edit-panel" id="editPanel">
<div class="edit-box">
<div class="edit-title">⚙ Configurar Client ID</div>
<div class="edit-subtitle">Insira o seu <b>Client ID</b> do aplicativo cadastrado no Spotify Developer Dashboard.</div>

<label>Client ID do App Spotify</label>
<input id="clientIdInput" type="text" placeholder="Cole seu Client ID aqui">

<div class="edit-actions">
<button id="cancelConfig" class="cancel">Cancelar</button>
<button id="saveClientIdBtn" class="save">Salvar Client ID</button>
</div>
</div>
</div>

<script>
const SCOPES = 'user-read-currently-playing user-read-playback-state';

const openConfigBtn = document.getElementById('openConfigBtn');
const editPanel = document.getElementById('editPanel');
const cancelConfig = document.getElementById('cancelConfig');
const clientIdInput = document.getElementById('clientIdInput');
const saveClientIdBtn = document.getElementById('saveClientIdBtn');

const connectNavBtn = document.getElementById('connectNavBtn');
const disconnectNavBtn = document.getElementById('disconnectNavBtn');

const bgToggleBtn = document.getElementById('bgToggleBtn');
const dynamicBg = document.getElementById('dynamicBg');
const bgAmbientCover = document.getElementById('bgAmbientCover');

const trackName = document.getElementById('trackName');
const artist = document.getElementById('artist');
const albumArt = document.getElementById('albumArt');
const fill = document.getElementById('fill');
const current = document.getElementById('current');
const duration = document.getElementById('duration');
const statusSub = document.getElementById('statusSub');
const discAnim = document.getElementById('discAnim');
const visualizerBars = document.querySelectorAll('.bar');

/* Gerenciador dos Efeitos Visuais */
function triggerEffect(type) {
  const container = document.getElementById('particleContainer');
  
  if (type === 'bolt') {
    const flash = document.getElementById('lightningFlash');
    flash.classList.remove('lightning-active');
    void flash.offsetWidth;
    flash.classList.add('lightning-active');
  }

  const items = {
    rose: ['🌹', '🌸', '🌺', '🥀'],
    bolt: ['⚡', '🌩️', '✨', '⚡'],
    money: ['💰', '💵', '💸', '🤑']
  };

  const selectedList = items[type] || ['✨'];
  const count = type === 'bolt' ? 22 : 30;

  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.classList.add('particle');
      el.textContent = selectedList[Math.floor(Math.random() * selectedList.length)];
      el.style.left = Math.random() * 92 + '%';
      
      const durationSec = (Math.random() * 1.8 + 1.2).toFixed(2);
      const sizePx = Math.floor(Math.random() * 18 + 22);
      
      el.style.fontSize = sizePx + 'px';
      el.style.animationDuration = durationSec + 's';
      
      container.appendChild(el);
      setTimeout(() => el.remove(), durationSec * 1000);
    }, i * 65);
  }
}

let isDynamicBgEnabled = localStorage.getItem('dynamic_bg_enabled') !== 'false';

function applyDynamicBgState() {
if (isDynamicBgEnabled) {
bgToggleBtn.innerHTML = '✨ FUNDO: ON';
dynamicBg.classList.add('active');
bgAmbientCover.classList.add('active');
} else {
bgToggleBtn.innerHTML = '✨ FUNDO: OFF';
dynamicBg.classList.remove('active');
bgAmbientCover.classList.remove('active');
}
}

bgToggleBtn.onclick = () => {
isDynamicBgEnabled = !isDynamicBgEnabled;
localStorage.setItem('dynamic_bg_enabled', isDynamicBgEnabled);
applyDynamicBgState();
};

function updateUIState() {
const token = localStorage.getItem('spotify_access_token');
if (token) {
connectNavBtn.style.display = 'none';
disconnectNavBtn.style.display = 'inline-flex';
} else {
connectNavBtn.style.display = 'inline-flex';
disconnectNavBtn.style.display = 'none';
}
}

openConfigBtn.onclick = () => {
clientIdInput.value = localStorage.getItem('spotify_client_id') || '';
editPanel.classList.add('show');
};
cancelConfig.onclick = () => editPanel.classList.remove('show');

saveClientIdBtn.onclick = () => {
const clientId = clientIdInput.value.trim();
if (!clientId) {
alert('Por favor, insira o seu Client ID.');
return;
}
localStorage.setItem('spotify_client_id', clientId);
editPanel.classList.remove('show');
alert('Client ID salvo com sucesso!');
};

function logoutSpotify() {
localStorage.removeItem('spotify_access_token');
localStorage.removeItem('spotify_refresh_token');
localStorage.removeItem('spotify_code_verifier');

trackName.textContent = 'Nenhuma música tocando';
artist.textContent = 'Conecte sua conta do Spotify';
statusSub.textContent = 'Clique em "CONECTAR SPOTIFY" para autorizar';
albumArt.style.backgroundImage = 'none';
bgAmbientCover.style.backgroundImage = 'none';
fill.style.width = '0%';
current.textContent = '00:00';
duration.textContent = '00:00';

setPlaybackState(false);
updateUIState();
}

disconnectNavBtn.onclick = logoutSpotify;

function generateRandomString(length) {
let text = '';
let possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
for (let i = 0; i < length; i++) {
text += possible.charAt(Math.floor(Math.random() * possible.length));
}
return text;
}

const digest = await window.crypto.subtle.digest('SHA-256', data);
return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
.replace(/\+/g, '-').replace(/\//
