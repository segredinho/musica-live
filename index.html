<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spotify Fullscreen Lyrics - Portrait</title>
<style>
/* ==========================================
   RESET E CONFIGURAÇÕES GLOBAIS
   ========================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'Inter',Segoe UI,Arial,sans-serif;background:#000000;color:#ffffff}
body{display:flex;align-items:center;justify-content:center}

/* ==========================================
   CONTAINER PRINCIPAL (FORMATO RETRATO 9:16)
   ========================================== */
.player{
position:relative;
width:100vw;
height:100vh;
max-width:576px;
aspect-ratio:9/16;
overflow:hidden;
background:#000;
display:flex;
flex-direction:column;
padding:20px;
}

/* Fundo desfoque da capa */
.bg-ambient-cover{
position:absolute;
inset:0;
background-size:cover;
background-position:center;
filter:blur(90px) brightness(0.5);
opacity:0.6;
z-index:0;
transition:background-image 1.5s ease;
pointer-events:none;
}

/* ==========================================
   BARRA SUPERIOR (CONFIGURAÇÕES E AUTENTICAÇÃO)
   ========================================== */
.top-overlay{
position:absolute;
top:15px;
left:15px;
right:15px;
z-index:10;
display:flex;
justify-content:space-between;
align-items:center;
}

.icon-btn{
width:34px;
height:34px;
border-radius:50%;
background:rgba(255,255,255,0.15);
border:none;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
backdrop-filter:blur(5px);
color:#fff;
font-size:14px;
transition:all 0.2s ease;
}

.badge-btn{
padding:6px 14px;
border:none;
border-radius:999px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(5px);
font-size:11px;
color:#fff;
font-weight:800;
cursor:pointer;
transition:all 0.2s ease;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

.badge-btn.connect-btn{color:#10b981;}
.badge-btn.disconnect-btn{color:#ef4444;display:none;}

/* ==========================================
   SISTEMA DE LETRAS MULTI-LINHAS (RETRAÇÃO 9:16)
   ========================================== */
.lyrics-container{
position:relative;
z-index:2;
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
width:100%;
height:100%;
padding:0 15px;
overflow:hidden;
}

.lyrics-wrapper{
display:flex;
flex-direction:column;
gap:24px;
width:100%;
align-items:center;
justify-content:center;
transition:transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}

/* Estilos de Cada Linha */
.lyric-line{
font-size:3.5vh;
font-weight:800;
color:rgba(255, 255, 255, 0.35);
line-height:1.2;
letter-spacing:-0.5px;
text-transform:uppercase;
transition:all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
word-wrap:break-word;
max-width:95%;
text-shadow:0 2px 8px rgba(0,0,0,0.8);
will-change:transform, opacity, color;
}

/* Linha Tocando Atualmente (Destaque Gigante) */
.lyric-line.active{
font-size:6.2vh;
font-weight:900;
color:#ffffff;
letter-spacing:-1.5px;
transform:scale(1.05);
text-shadow:0 0 30px rgba(255, 255, 255, 0.6), 0 4px 20px rgba(0,0,0,0.9);
}

.lyric-line.previous{
font-size:2.8vh;
opacity:0.4;
}

.lyric-line.next{
font-size:3.2vh;
opacity:0.6;
}

.lyrics-status-msg{
font-size:3vh;
font-weight:700;
color:rgba(255,255,255,0.7);
text-align:center;
text-transform:none;
}

/* ==========================================
   MODAL DE CONFIGURAÇÃO DO CLIENT ID
   ========================================== */
.modal-overlay{
position:absolute;
inset:0;
z-index:20;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.85);
backdrop-filter:blur(8px);
}

.modal-overlay.show{display:flex;}

.edit-box{
width:85%;
max-width:320px;
padding:25px;
border-radius:20px;
background:#111;
text-align:center;
color:#fff;
border:1px solid rgba(255,255,255,0.1);
}

.edit-title{font-size:16px;font-weight:900;}
.edit-subtitle{color:rgba(255,255,255,0.6);font-size:12px;margin:8px 0 15px;}
.edit-box input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid rgba(255,255,255,0.1);
background:#000;
color:#fff;
outline:none;
font-size:12px;
}

.edit-actions{display:flex;gap:10px;margin-top:20px;}
.edit-actions button{
flex:1;
padding:12px;
border-radius:10px;
font-weight:800;
cursor:pointer;
border:none;
}

.cancel{background:rgba(255,255,255,0.1);color:#fff;}
.save{background:#1db954;color:#fff;}
</style>
</head>
<body>

<div class="player" id="player">
    <div class="bg-ambient-cover" id="bgAmbientCover"></div>

    <!-- Barra Superior -->
    <div class="top-overlay">
        <button class="icon-btn" id="openConfigBtn" title="Configurar Client ID">⚙</button>
        <button class="badge-btn connect-btn" id="connectNavBtn">🎧 CONECTAR SPOTIFY</button>
        <button class="badge-btn disconnect-btn" id="disconnectNavBtn">❌ DESCONECTAR</button>
    </div>

    <!-- ÁREA DE LETRA -->
    <div class="lyrics-container" id="lyricsContainer">
        <div class="lyrics-status-msg" id="statusMsg">Aguardando conexão...</div>
    </div>
</div>

<!-- Modal de Configuração -->
<div class="modal-overlay" id="editPanel">
    <div class="edit-box">
        <div class="edit-title">Configurar Client ID</div>
        <div class="edit-subtitle">Insira o Client ID do seu aplicativo no Spotify Developer Dashboard.</div>
        <input id="clientIdInput" type="text" placeholder="Cole seu Client ID aqui">
        <div class="edit-actions">
            <button id="cancelConfig" class="cancel">Cancelar</button>
            <button id="saveClientIdBtn" class="save">Salvar</button>
        </div>
    </div>
</div>

<script>
// ==========================================
// CONFIGURAÇÕES E ESTADO DO PLAYER
// ==========================================
const SCOPES = 'user-read-currently-playing user-read-playback-state';
const DEFAULT_CLIENT_ID = '57263ff164654084a66392c80efdae23';

let clientId = localStorage.getItem('spotify_client_id') || DEFAULT_CLIENT_ID;
let accessToken = localStorage.getItem('spotify_access_token') || '';

localStorage.setItem('spotify_client_id', clientId);

// Elementos da Interface
const openConfigBtn = document.getElementById('openConfigBtn');
const editPanel = document.getElementById('editPanel');
const cancelConfig = document.getElementById('cancelConfig');
const clientIdInput = document.getElementById('clientIdInput');
const saveClientIdBtn = document.getElementById('saveClientIdBtn');
const connectNavBtn = document.getElementById('connectNavBtn');
const disconnectNavBtn = document.getElementById('disconnectNavBtn');
const bgAmbientCover = document.getElementById('bgAmbientCover');
const lyricsContainer = document.getElementById('lyricsContainer');

// Variáveis de Controle
let currentTrackId = null;
let currentLyricsLines = [];
let localProgressMs = 0;
let isPlayingState = false;
let lastSyncTimestamp = Date.now();
let activeIndex = -1;

// ==========================================
// EVENTOS DE CONFIGURAÇÃO E AUTENTICAÇÃO
// ==========================================
openConfigBtn.onclick = () => { clientIdInput.value = clientId; editPanel.classList.add('show'); };
cancelConfig.onclick = () => editPanel.classList.remove('show');
saveClientIdBtn.onclick = () => {
    clientId = clientIdInput.value.trim();
    localStorage.setItem('spotify_client_id', clientId);
    editPanel.classList.remove('show');
    alert('Client ID atualizado com sucesso!');
};

connectNavBtn.onclick = async () => {
    if (!clientId) { alert('Configure o Client ID ⚙ primeiro.'); openConfigBtn.click(); return; }
    
    if (window.location.protocol === 'file:') {
        alert('Atenção: O Spotify exige um servidor local (como Live Server) ou hospedagem (Netlify/GitHub Pages) para autenticar.');
        return;
    }

    const verifier = generateRandomString(128);
    const challenge = await generateCodeChallenge(verifier);
    localStorage.setItem('code_verifier', verifier);

    const redirectUri = window.location.origin + window.location.pathname;
    const args = new URLSearchParams({
        response_type: 'code',
        client_id: clientId,
        scope: SCOPES,
        redirect_uri: redirectUri,
        code_challenge_method: 'S256',
        code_challenge: challenge
    });

    window.location.href = 'https://accounts.spotify.com/authorize?' + args.toString();
};

disconnectNavBtn.onclick = () => {
    localStorage.removeItem('spotify_access_token');
    accessToken = '';
    updateAuthUI();
    location.reload();
};

function generateRandomString(length) {
    let text = '';
    const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    for (let i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
    return text;
}

async function generateCodeChallenge(codeVerifier) {
    const digest = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(codeVerifier));
    return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function handleOAuthCallback() {
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const error = urlParams.get('error');

    if (error) {
        showStatusMessage(`❌ Erro: ${error}`);
        return;
    }

    if (code) {
        const verifier = localStorage.getItem('code_verifier');
        const redirectUri = window.location.origin + window.location.pathname;
        const body = new URLSearchParams({
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: redirectUri,
            client_id: clientId,
            code_verifier: verifier
        });

        try {
            showStatusMessage('Autenticando...');
            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });

            const data = await response.json();
            if (data.access_token) {
                accessToken = data.access_token;
                localStorage.setItem('spotify_access_token', accessToken);
                window.history.replaceState({}, document.title, redirectUri);
                showStatusMessage('Conectado!');
            } else {
                showStatusMessage('❌ Erro no Token');
            }
        } catch (e) {
            showStatusMessage('❌ Falha na conexão');
        }
    }
    updateAuthUI();
}

function updateAuthUI() {
    if (accessToken) {
        connectNavBtn.style.display = 'none';
        disconnectNavBtn.style.display = 'inline-flex';
    } else {
        connectNavBtn.style.display = 'inline-flex';
        disconnectNavBtn.style.display = 'none';
    }
}

function showStatusMessage(text) {
    lyricsContainer.innerHTML = `<div class="lyrics-status-msg">${text}</div>`;
}

// ==========================================
// INTEGRAÇÃO COM O SPOTIFY E LRCLIB
// ==========================================
async function fetchCurrentlyPlaying() {
    if (!accessToken) return;
    try {
        const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
            headers: { 'Authorization': `Bearer ${accessToken}` }
        });

        if (res.status === 204) {
            showStatusMessage('Nenhuma música tocando no momento.');
            bgAmbientCover.style.backgroundImage = '';
            return;
        }

        if (res.status === 401) {
            localStorage.removeItem('spotify_access_token');
            accessToken = '';
            updateAuthUI();
            showStatusMessage('Sessão expirada. Reconecte.');
            return;
        }

        const data = await res.json();
        if (!data || !data.item) return;

        const item = data.item;
        isPlayingState = data.is_playing;
        localProgressMs = data.progress_ms || 0;
        lastSyncTimestamp = Date.now();

        if (item.album && item.album.images.length > 0) {
            bgAmbientCover.style.backgroundImage = `url('${item.album.images[0].url}')`;
        }

        if (currentTrackId !== item.id) {
            currentTrackId = item.id;
            activeIndex = -1;
            fetchLyricsLRCLIB(item.name, item.artists[0].name, item.duration_ms / 1000);
        }
    } catch (err) {
        console.error(err);
    }
}

async function fetchLyricsLRCLIB(track, artist, durationSec) {
    currentLyricsLines = [];
    try {
        const query = new URLSearchParams({ track_name: track, artist_name: artist, duration: Math.round(durationSec) });
        const res = await fetch(`https://lrclib.net/api/get?${query.toString()}`);
        if (res.ok) {
            const data = await res.json();
            if (data.syncedLyrics) {
                parseSyncedLyrics(data.syncedLyrics);
                renderLyricsDOM();
                return;
            }
        }
        showStatusMessage(`Letra sincronizada não encontrada.<br><br><small style="font-size:2vh">${track} - ${artist}</small>`);
    } catch (e) {
        showStatusMessage(`${track} - ${artist}`);
    }
}

function parseSyncedLyrics(lrcText) {
    const lines = lrcText.split('\n');
    currentLyricsLines = [];
    lines.forEach(line => {
        const match = line.match(/\[(\d+):(\d+\.\d+)\](.*)/);
        if (match) {
            const timeMs = (parseInt(match[1]) * 60 + parseFloat(match[2])) * 1000;
            const text = match[3].trim();
            if (text) currentLyricsLines.push({ timeMs, text });
        }
    });
}

// Renderiza todas as linhas de letra no DOM
function renderLyricsDOM() {
    lyricsContainer.innerHTML = '';
    const wrapper = document.createElement('div');
    wrapper.className = 'lyrics-wrapper';
    wrapper.id = 'lyricsWrapper';

    currentLyricsLines.forEach((lineObj, index) => {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        div.id = `line-${index}`;
        div.textContent = lineObj.text;
        wrapper.appendChild(div);
    });

    lyricsContainer.appendChild(wrapper);
}

// Atualização Contínua e Animação de Sincronização
function updatePlaybackLoop() {
    if (isPlayingState && currentLyricsLines.length > 0) {
        const now = Date.now();
        const currentMs = localProgressMs + (now - lastSyncTimestamp);

        let foundIndex = -1;
        for (let i = 0; i < currentLyricsLines.length; i++) {
            if (currentMs >= currentLyricsLines[i].timeMs) {
                foundIndex = i;
            } else {
                break;
            }
        }

        if (foundIndex !== -1 && foundIndex !== activeIndex) {
            activeIndex = foundIndex;
            updateActiveLyricUI(activeIndex);
        }
    }
    requestAnimationFrame(updatePlaybackLoop);
}

function updateActiveLyricUI(idx) {
    const lines = document.querySelectorAll('.lyric-line');
    lines.forEach((line, i) => {
        line.classList.remove('active', 'previous', 'next');
        if (i === idx) {
            line.classList.add('active');
        } else if (i === idx - 1) {
            line.classList.add('previous');
        } else if (i === idx + 1) {
            line.classList.add('next');
        }
    });

    const activeEl = document.getElementById(`line-${idx}`);
    if (activeEl) {
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
}

// Inicialização
window.onload = async () => {
    await handleOAuthCallback();
    updateAuthUI();
    requestAnimationFrame(updatePlaybackLoop);
    if (accessToken) {
        fetchCurrentlyPlaying();
        setInterval(fetchCurrentlyPlaying, 3000);
    }
};
</script>
</body>
</html>
