<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Music Live Player - Neumorphism Edition</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'Inter',Segoe UI,Arial,sans-serif;background:#0d111a;color:#1e293b}
body{display:flex;align-items:center;justify-content:center}

.player{
position:relative;width:100vw;height:100vh;max-width:420px;max-height:860px;
aspect-ratio: 9/16; overflow:hidden;
background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 50%, #94a3b8 100%);
display:flex;flex-direction:column;justify-content:space-between;
padding: 24px 20px 28px;
box-shadow: 0 25px 60px rgba(0,0,0,0.4);
border-radius: 40px;
}

/* Fundo Ambiental / Blur com a Capa */
.bg-ambient-cover{
position:absolute;inset:0;background-size:cover;background-position:center;
filter:blur(40px) brightness(1.2);opacity:0.25;z-index:0;transition:opacity 1s ease, background-image 1.5s ease;
pointer-events:none;
}

/* Topo (Cabeçalho) */
.top{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;width:100%}
.icon-btn{
width:42px;height:42px;border-radius:50%;background:#ffffff;border:none;
display:flex;align-items:center;justify-content:center;cursor:pointer;
box-shadow: 6px 6px 16px rgba(163,177,198,0.6), -6px -6px 16px rgba(255,255,255,0.8);
color:#334155;font-size:16px;transition:all 0.2s ease;
}
.icon-btn:active{box-shadow: inset 3px 3px 6px rgba(163,177,198,0.6), inset -3px -3px 6px rgba(255,255,255,0.8);transform:scale(0.96);}
.playlist-title{font-size:14px;font-weight:700;color:#334155;letter-spacing:-0.2px}

/* Centro (Capa/Disco Circular Estilo Neumorphism) */
.center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:auto 0;width:100%;gap:22px}

.disc-compact-wrap{
position:relative;
width: 230px;
height: 230px;
border-radius: 50%;
background: linear-gradient(135deg, #f1f5f9, #cbd5e1);
box-shadow: 14px 14px 30px rgba(163,177,198,0.7), -14px -14px 30px rgba(255,255,255,0.9);
display:flex;align-items:center;justify-content:center;
will-change: transform;
}

.album-art{
position:absolute;inset:12px;border-radius:50%;
background-size:cover;background-position:center;
box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 10px 25px rgba(0,0,0,0.15);
transition: all 0.4s ease;
}

/* Badge "NOW PLAYING" */
.now-playing-badge{
background: linear-gradient(135deg, #ff2d88, #ff007f);
color: #fff;font-size: 10px;font-weight: 800;letter-spacing: 2px;
padding: 6px 18px;border-radius: 999px;text-transform: uppercase;
box-shadow: 0 6px 16px rgba(255,0,127,0.4);
}

/* Informações da Música & Artista */
.track{position:relative;z-index:3;width:100%;text-align:center;display:flex;flex-direction:column;gap:4px}
.trackname{font-size:22px;font-weight:900;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.5px}
.artist{font-size:12px;color:#64748b;font-weight:600}

/* Barra de Progresso Neumórfica */
.progress-container{width:100%;padding:0 8px;margin-top:6px}
.progress{height:6px;border-radius:20px;background:#cbd5e1;box-shadow: inset 2px 2px 5px rgba(163,177,198,0.8), inset -2px -2px 5px rgba(255,255,255,0.9);overflow:hidden;position:relative;cursor:pointer}
.fill{width:0%;height:100%;background:linear-gradient(90deg, #ff2d88, #7c4dff);border-radius:20px;transition:width 0.3s ease}
.times{display:flex;justify-content:space-between;margin-top:6px;color:#64748b;font-size:10px;font-weight:700}

/* Controles Inferiores (Botões Play/Pause Rosa Neumorphism) */
.bottom{position:relative;z-index:3;width:100%;display:flex;align-items:center;justify-content:space-around;padding-top:10px}
.control-btn{
background:none;border:none;cursor:pointer;color:#64748b;font-size:16px;font-weight:700;
transition:all 0.2s ease;display:flex;align-items:center;justify-content:center;
}
.control-btn:hover{color:#0f172a}
.play-pause-btn{
width:64px;height:64px;border-radius:50%;
background: linear-gradient(135deg, #ff3388, #e6006f);
box-shadow: 8px 8px 20px rgba(230,0,111,0.4), -6px -6px 16px rgba(255,255,255,0.8);
color:#fff;font-size:22px;border:none;cursor:pointer;
display:flex;align-items:center;justify-content:center;transition:all 0.2s ease;
}
.play-pause-btn:active{
box-shadow: inset 4px 4px 8px rgba(150,0,70,0.4), inset -4px -4px 8px rgba(255,100,160,0.4);
transform:scale(0.96);
}

/* Modal Config / Conectar */
.modal-overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,0.6);backdrop-filter:blur(8px)}
.modal-overlay.show{display:flex}
.edit-box{width:88%;padding:22px;border-radius:20px;background:#f8fafc;box-shadow:0 20px 40px rgba(0,0,0,0.3);text-align:center;color:#0f172a}
.edit-title{font-size:16px;font-weight:900;color:#0f172a}
.edit-subtitle{color:#64748b;font-size:11px;margin:6px 0 14px;line-height:1.4}
.edit-box label{display:block;margin:6px 0 4px;color:#475569;font-size:11px;font-weight:700;text-align:left}
.edit-box input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:#0f172a;outline:none;font-size:12px}
.edit-actions{display:flex;gap:10px;margin-top:16px}
.edit-actions button{flex:1;padding:10px;border-radius:10px;font-weight:800;font-size:11px;cursor:pointer}
.cancel{background:#e2e8f0;border:none;color:#475569}
.save{background:#ff007f;border:none;color:#fff}

/* Painel Spotify / Extra de Conexão no Topo */
.spotify-top-bar {
display:flex; justify-content:space-between; width:100%; margin-bottom: 10px;
}
.badge-btn {
padding: 6px 12px; border: none; border-radius: 999px;
background: #ffffff; box-shadow: 4px 4px 10px rgba(163,177,198,0.5), -4px -4px 10px rgba(255,255,255,0.8);
font-size: 10px; color: #334155; font-weight: 800; cursor: pointer; transition: all 0.2s ease;
}
.badge-btn.connect-btn { color: #10b981; }
.badge-btn.disconnect-btn { color: #ef4444; display: none; }
</style>
</head>
<body>
<div class="player" id="player">
<div class="bg-ambient-cover" id="bgAmbientCover"></div>

<!-- Barra Superior Estilo Referência -->
<div class="top">
  <button class="icon-btn" onclick="history.back()">❮</button>
  <div class="playlist-title">Your Playlist</div>
  <button class="icon-btn" id="openConfigBtn">⚙</button>
</div>

<!-- Ações Spotify e Status -->
<div class="spotify-top-bar">
  <button class="badge-btn connect-btn" id="connectNavBtn">🎧 CONECTAR SPOTIFY</button>
  <button class="badge-btn disconnect-btn" id="disconnectNavBtn">❌ DESCONECTAR</button>
</div>

<!-- Centro com Grande Círculo de Capa/Álbum -->
<div class="center">
  <div class="disc-compact-wrap" id="elem-disc">
    <div class="album-art" id="albumArt" style="background-image: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500&auto=format&fit=crop&q=60');"></div>
  </div>

  <div class="now-playing-badge">Now Playing</div>

  <div class="track">
    <div class="trackname" id="trackName">Lovestruck</div>
    <div class="artist" id="artist">Jane Doe feat Dolor</div>
  </div>

  <div class="progress-container">
    <div class="progress"><div class="fill" id="fill"></div></div>
    <div class="times"><span id="current">00:40</span><span id="duration">02:28</span></div>
  </div>
</div>

<!-- Controles Inferiores -->
<div class="bottom">
  <button class="control-btn" title="Shuffle">🔀</button>
  <button class="control-btn" title="Previous">⏮</button>
  <button class="play-pause-btn" id="playPauseBtn" onclick="togglePlayState()">⏸</button>
  <button class="control-btn" title="Next">⏭</button>
  <button class="control-btn" title="Repeat">🔁</button>
</div>
</div>

<!-- Modal Config Client ID -->
<div class="modal-overlay" id="editPanel">
  <div class="edit-box">
    <div class="edit-title">⚙ Configurar Client ID do Spotify</div>
    <div class="edit-subtitle">Insira o seu <b>Client ID</b> cadastrado no Spotify Developer Dashboard.</div>
    <label>Client ID</label>
    <input id="clientIdInput" type="text" placeholder="Cole seu Client ID aqui">
    <div class="edit-actions">
      <button id="cancelConfig" class="cancel">Cancelar</button>
      <button id="saveClientIdBtn" class="save">Salvar</button>
    </div>
  </div>
</div>

<script>
const SCOPES = 'user-read-currently-playing user-read-playback-state';
let clientId = localStorage.getItem('spotify_client_id') || '';
let accessToken = localStorage.getItem('spotify_access_token') || '';

const openConfigBtn = document.getElementById('openConfigBtn');
const editPanel = document.getElementById('editPanel');
const cancelConfig = document.getElementById('cancelConfig');
const clientIdInput = document.getElementById('clientIdInput');
const saveClientIdBtn = document.getElementById('saveClientIdBtn');

const connectNavBtn = document.getElementById('connectNavBtn');
const disconnectNavBtn = document.getElementById('disconnectNavBtn');

const bgAmbientCover = document.getElementById('bgAmbientCover');
const trackName = document.getElementById('trackName');
const artist = document.getElementById('artist');
const albumArt = document.getElementById('albumArt');
const fill = document.getElementById('fill');
const current = document.getElementById('current');
const duration = document.getElementById('duration');
const playPauseBtn = document.getElementById('playPauseBtn');

let isPlayingState = false;

openConfigBtn.onclick = () => {
  clientIdInput.value = clientId;
  editPanel.classList.add('show');
};
cancelConfig.onclick = () => editPanel.classList.remove('show');
saveClientIdBtn.onclick = () => {
  clientId = clientIdInput.value.trim();
  localStorage.setItem('spotify_client_id', clientId);
  editPanel.classList.remove('show');
  alert('Client ID salvo com sucesso!');
};

function togglePlayState() {
  isPlayingState = !isPlayingState;
  playPauseBtn.textContent = isPlayingState ? '▶' : '⏸';
}

connectNavBtn.onclick = async () => {
  if (!clientId) {
    alert('Por favor, configure o seu Client ID no botão de engrenagem ⚙ primeiro.');
    openConfigBtn.click();
    return;
  }
  const verifier = generateRandomString(128);
  const challenge = await generateCodeChallenge(verifier);
  localStorage.setItem('code_verifier', verifier);

  const redirectUri = window.location.href.split('#')[0].split('?')[0];
  const args = new URLSearchParams({
    response_type: 'code',
    client_id: clientId,
    scope: SCOPES,
    redirect_uri: redirectUri,
    code_challenge_method: 'S256',
    code_challenge: challenge
  });
  window.location.href = 'https://accounts.spotify.com/authorize?' + args.toString();
};

disconnectNavBtn.onclick = () => {
  localStorage.removeItem('spotify_access_token');
  accessToken = '';
  updateAuthUI();
  location.reload();
};

function generateRandomString(length) {
  let text = '';
  const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  for (let i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
  return text;
}

async function generateCodeChallenge(codeVerifier) {
  const digest = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(codeVerifier));
  return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function handleOAuthCallback() {
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');
  if (code) {
    const verifier = localStorage.getItem('code_verifier');
    const redirectUri = window.location.href.split('#')[0].split('?')[0];
    const body = new URLSearchParams({
      grant_type: 'authorization_code',
      code: code,
      redirect_uri: redirectUri,
      client_id: clientId,
      code_verifier: verifier
    });
    try {
      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body
      });
      const data = await response.json();
      if (data.access_token) {
        accessToken = data.access_token;
        localStorage.setItem('spotify_access_token', accessToken);
        window.history.replaceState({}, document.title, redirectUri);
      }
    } catch (e) {
      console.error(e);
    }
  }
  updateAuthUI();
}

function updateAuthUI() {
  if (accessToken) {
    connectNavBtn.style.display = 'none';
    disconnectNavBtn.style.display = 'inline-flex';
  } else {
    connectNavBtn.style.display = 'inline-flex';
    disconnectNavBtn.style.display = 'none';
  }
}

async function fetchCurrentlyPlaying() {
  if (!accessToken) return;
  try {
    const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
      headers: { 'Authorization': `Bearer ${accessToken}` }
    });
    if (res.status === 204 || res.status === 401) return;
    const data = await res.json();
    if (!data || !data.item) return;

    const item = data.item;
    trackName.textContent = item.name;
    artist.textContent = item.artists.map(a => a.name).join(', ');

    if (item.album && item.album.images && item.album.images.length > 0) {
      const imgUrl = item.album.images[0].url;
      albumArt.style.backgroundImage = `url('${imgUrl}')`;
      bgAmbientCover.style.backgroundImage = `url('${imgUrl}')`;
    }
  } catch (err) {
    console.error(err);
  }
}

window.onload = async () => {
  await handleOAuthCallback();
  updateAuthUI();
  if (accessToken) {
    fetchCurrentlyPlaying();
    setInterval(fetchCurrentlyPlaying, 4000);
  }
};
</script>
</body>
</html>
