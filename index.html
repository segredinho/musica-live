<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Music Live Player - Hip Hop & Rap Edition</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'Inter',Segoe UI,Arial,sans-serif;background:#030307;color:#fff}
body{display:flex;align-items:center;justify-content:center}

:root {
  --disc-size: 140px;
  --c1: #00eaff;
  --c2: #7c4dff;
  --c3: #ff24c4;
}

.player{
position:relative;width:100vw;height:100vh;max-width:540px;max-height:960px;
aspect-ratio: 9/16; overflow:hidden;
background:
radial-gradient(circle at 50% 20%,rgba(44,90,255,.35),transparent 40%),
radial-gradient(circle at 20% 60%,rgba(255,0,153,.25),transparent 35%),
radial-gradient(circle at 80% 75%,rgba(0,224,255,.22),transparent 35%),
linear-gradient(180deg,#05060e 0%,#090a18 50%,#020206 100%);
display:flex;flex-direction:column;justify-content:space-between;
padding: 16px 16px 12px;
will-change: transform;
box-shadow: 0 0 50px rgba(0,0,0,0.8);
}

.player:before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 180deg,transparent,#1d42ff22,transparent,#ff18b322,transparent);filter:blur(60px);animation:spin 18s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.grid{position:absolute;inset:0;opacity:.1;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:36px 36px;transform:perspective(500px) rotateX(58deg) scale(1.8);transform-origin:bottom;top:30%;pointer-events:none}

.top{position:relative;z-index:3;display:flex;flex-direction:column;gap:6px;align-items:center}
.top-info{display:flex;gap:8px;align-items:center}
.live{display:flex;gap:6px;align-items:center;font-weight:900;letter-spacing:2px;font-size:12px;color:#fff;background:rgba(255,255,255,0.06);padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,0.12)}
.bpm-badge{font-weight:800;font-size:11px;color:#00eaff;background:rgba(0,234,255,0.1);padding:4px 10px;border-radius:999px;border:1px solid rgba(0,234,255,0.25);transition:all 0.2s ease}
.dot{width:6px;height:6px;border-radius:50%;background:#ff315d;box-shadow:0 0 10px #ff315d;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(.6);opacity:.5}}

.top-actions{display:none;gap:6px;flex-wrap:wrap;justify-content:center}
.top-actions.active{display:flex}

.badge-btn{
padding:4px 8px;border:1px solid #ffffff20;border-radius:999px;
background:#ffffff0d;backdrop-filter:blur(12px);font-size:10px;
color:#b9c7ff;font-weight:700;cursor:pointer;transition:all .2s ease;
display:inline-flex;align-items:center;gap:4px;
}
.badge-btn:hover{background:#ffffff22;color:#fff}
.badge-btn.connect-btn{border-color:#1ed76088;background:#061a0cdd;color:#1ed760}
.badge-btn.disconnect-btn{border-color:#ff315d88;background:#2a060cdd;color:#ff315d;display:none}

.center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:auto 0;gap:10px}

.disc-compact-wrap{
position:relative;
width: var(--disc-size, 140px);
height: var(--disc-size, 140px);
transition: width 0.3s ease, height 0.3s ease;
will-change: transform;
animation: autoBeatPulse 0.5s ease-in-out infinite alternate;
animation-play-state: paused;
display:flex;align-items:center;justify-content:center;
}

@keyframes autoBeatPulse {
  0% { transform: scale(0.96); }
  100% { transform: scale(1.05); }
}

.equalizer-svg {
position:absolute;
inset:-26px;
width: calc(100% + 52px);
height: calc(100% + 52px);
pointer-events:none;
z-index:1;
animation: spinReverse 12s linear infinite;
animation-play-state: paused;
}
@keyframes spinReverse { to { transform: rotate(-360deg); } }

.glow{
position:absolute;inset:-6px;border-radius:50%;
background:linear-gradient(45deg,var(--c1, #00eaff),var(--c2, #6c4dff),var(--c3, #ff27bc));
filter:blur(18px);opacity:.75;transition:all 0.5s ease;
}

/* Fumaça e Névoa Hip-Hop */
.smoke-fog {
position: absolute; inset: -40px; border-radius: 50%;
background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0) 70%);
filter: blur(20px); pointer-events: none; opacity: 0.6; z-index: 0;
animation: smokeDrift 6s ease-in-out infinite alternate;
}
@keyframes smokeDrift {
  0% { transform: scale(0.9) rotate(0deg); opacity:0.4; }
  100% { transform: scale(1.15) rotate(180deg); opacity:0.75; }
}

/* 1. Ouro / Bling Street Theme */
.disc-compact-wrap.effect-gold .glow {
background: radial-gradient(circle, #ffd700 0%, #ff8800 60%, #ff0055 100%);
filter: blur(22px); opacity:0.95;
}
.disc-compact-wrap.effect-gold .disc {
border: 3px solid #ffe600;
box-shadow: 0 0 35px rgba(255,215,0,0.8), inset 0 0 20px #000;
background: repeating-radial-gradient(circle,#1a1400 0 4px,#332800 5px 7px);
}
.disc-compact-wrap.effect-gold .gold-chain {
display: block !important;
}

.gold-chain {
display:none;
position:absolute;
inset: -14px;
border-radius: 50%;
border: 6px dashed #ffd700;
box-shadow: 0 0 20px #ffd700, inset 0 0 10px #ffaa00;
animation: spinChain 8s linear infinite;
pointer-events:none;
z-index:5;
}
@keyframes spinChain { to { transform: rotate(360deg); } }

/* 2. Fogo / Trap Heat Theme */
.disc-compact-wrap.effect-fire .glow {
background: radial-gradient(circle, #ff3300 0%, #ff8000 50%, #ff0055 100%);
filter: blur(28px); opacity:1;
animation: fireGlow 0.3s ease-in-out infinite alternate;
}
@keyframes fireGlow { 0% { opacity:0.75; filter:blur(20px); } 100% { opacity:1; filter:blur(32px); } }
.disc-compact-wrap.effect-fire .disc {
border: 2px solid #ff5500;
box-shadow: 0 0 40px #ff3300, inset 0 0 25px #ff1a00;
}
.disc-compact-wrap.effect-fire .fire-particles {
display:block !important;
}
.fire-particles {
display:none; position:absolute; inset:-20px; border-radius:50%; pointer-events:none; z-index:0;
background: radial-gradient(circle, transparent 40%, rgba(255,68,0,0.5) 80%);
filter: blur(10px);
animation: firePulse 0.4s infinite alternate;
}
@keyframes firePulse { 0% { transform: scale(0.96); } 100% { transform: scale(1.1); } }

/* 3. Cyber Neon Theme */
.disc-compact-wrap.effect-cyber .glow {
background: linear-gradient(135deg, #00ffcc, #ff007f, #00eaff);
filter: blur(24px); opacity:0.95;
}
.disc-compact-wrap.effect-cyber .disc {
border: 2px solid #00ffcc;
box-shadow: 0 0 35px #00ffcc, inset 0 0 20px #ff007f;
}

/* 4. Glitch / Drill Street Theme & HUD Overlay */
.disc-compact-wrap.effect-glitch .album-art {
animation: glitchArt 0.7s infinite steps(2);
}
.disc-compact-wrap.effect-glitch .hud-scanner {
display: block !important;
}

@keyframes glitchArt {
0% { transform: translate(0,0) scale(1); filter: saturate(2) hue-rotate(0deg); }
25% { transform: translate(-3px, 2px) scale(1.02); filter: saturate(3) hue-rotate(90deg); }
50% { transform: translate(3px, -2px) scale(0.98); filter: saturate(1) hue-rotate(180deg); }
75% { transform: translate(-2px, -1px) scale(1.01); filter: saturate(4) hue-rotate(270deg); }
100% { transform: translate(0,0) scale(1); filter: saturate(2) hue-rotate(360deg); }
}

.hud-scanner {
display: none; position: absolute; inset: -12px; border-radius: 50%;
border: 1px dashed #00eaff; opacity: 0.8; pointer-events: none; z-index: 6;
animation: hudSpin 4s linear infinite;
}
.hud-scanner:before {
content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
background: #00eaff; box-shadow: 0 0 10px #00eaff; animation: hudScan 1.5s ease-in-out infinite alternate;
}
@keyframes hudSpin { to { transform: rotate(360deg); } }
@keyframes hudScan { 0% { top: 0%; } 100% { top: 95%; } }

.disc{
position:absolute;inset:8px;border-radius:50%;
background:repeating-radial-gradient(circle,#090a10 0 4px,#161923 5px 7px);
border:2px solid #ffffff18;box-shadow:0 0 24px #294dff66, inset 0 0 16px #000;
animation:record 4s linear infinite;
animation-play-state: paused;
z-index:2;
}
@keyframes record{to{transform:rotate(360deg)}}
.disc:before{content:"";position:absolute;inset:38%;border-radius:50%;background:linear-gradient(135deg,var(--c1, #00eaff),var(--c2, #6b5cff) 55%,var(--c3, #ff2ac3));box-shadow:0 0 16px #00eaff88;z-index:2}

.album-art{
position:absolute;inset:28px;border-radius:50%;
background-size:cover;background-position:center;
opacity:.88;filter:saturate(1.3) contrast(1.1);
mix-blend-mode:normal;z-index:3;
border: 2px solid rgba(255,255,255,0.4);
box-shadow: inset 0 0 12px rgba(0,0,0,0.8), 0 0 18px rgba(255,255,255,0.2);
transition: all 0.4s ease;
}
.album-art:hover {
transform: scale(1.04);
filter: saturate(1.8) contrast(1.2);
}

.disc-effects-selector {
display:flex;gap:4px;background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);
padding:4px 8px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);
margin-top: 2px;z-index: 5;
}
.effect-chip {
font-size:9px;font-weight:800;padding:4px 9px;border-radius:12px;
background:rgba(255,255,255,0.08);color:#aab4d0;border:1px solid transparent;
cursor:pointer;transition:all 0.2s ease;
}
.effect-chip.active, .effect-chip:hover {
background:linear-gradient(135deg, #00eaff, #ff007f);
color:#fff;border-color:rgba(255,255,255,0.5);
box-shadow:0 0 12px rgba(0,234,255,0.6);
}

.lyrics-box{
width:100%;max-height:120px;min-height:85px;
background:rgba(10, 14, 28, 0.78);backdrop-filter:blur(16px);
border:1px solid rgba(255, 255, 255, 0.12);border-radius:14px;
padding:8px 12px;display:flex;flex-direction:column;align-items:center;
justify-content:center;text-align:center;overflow:hidden;position:relative;
box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.lyrics-title-tag{font-size:8px;letter-spacing:2px;color:#00eaff;font-weight:800;text-transform:uppercase;margin-bottom:3px}
.lyrics-content{font-size:12px;font-weight:700;color:#e2e8f0;line-height:1.35;transition:all 0.3s ease;max-width:100%}
.lyrics-line{opacity:0.4;transition:all 0.3s ease;margin:2px 0;font-size:11px}
.lyrics-line.active{opacity:1;color:#00eaff;font-size:13px;transform:scale(1.02);text-shadow:0 0 10px rgba(0,234,255,0.5)}

.track{position:relative;z-index:3;width:100%;text-align:center;padding:0 4px;margin-bottom:4px}
.trackname{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.3px}
.artist{font-size:10px;color:#a0accf;margin-top:1px;font-weight:600}
.progress{margin-top:6px;height:4px;border-radius:20px;background:#ffffff18;overflow:hidden;position:relative}
.fill{width:0%;height:100%;background:linear-gradient(90deg,var(--c1, #00eaff),var(--c2, #6d55ff),var(--c3, #ff32bf));box-shadow:0 0 10px #5b6dff;transition:width 0.3s ease}
.times{display:flex;justify-content:space-between;margin-top:3px;color:#6d7799;font-size:9px;font-weight:700}

.bottom{position:relative;z-index:3;width:100%;display:flex;flex-direction:column;gap:6px}
.main-effects-btn{
width:100%;padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,0.25);
background:linear-gradient(135deg,rgba(255,0,128,0.2),rgba(0,234,255,0.2));
color:#fff;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
cursor:pointer;backdrop-filter:blur(16px);box-shadow:0 4px 16px rgba(0,0,0,0.4);
transition:all .3s ease;display:flex;align-items:center;justify-content:center;gap:6px;
}
.main-effects-btn:hover{transform:scale(1.02);box-shadow:0 0 16px rgba(0,234,255,0.4)}

.effects-menu{
display:none;grid-template-columns:repeat(4, 1fr);gap:6px;padding:8px;border-radius:12px;
background:rgba(10,12,24,0.92);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);
animation:slideUp 0.3s ease;
}
.effects-menu.show{display:grid}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.anim-btn{padding:6px 4px;border-radius:8px;border:1px solid #ffffff20;background:rgba(255,255,255,0.06);color:#fff;font-size:9px;font-weight:700;cursor:pointer;transition:all .2s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.anim-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,0.18)}
.anim-btn.rose{border-color:#ff336655;color:#ff6688}
.anim-btn.bolt{border-color:#00eaff55;color:#00eaff}
.anim-btn.money{border-color:#1ed76055;color:#1ed760}
.anim-btn.fire{border-color:#ff770055;color:#ffaa00}

.particle-container{position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.particle{position:absolute;top:-50px;font-size:22px;user-select:none;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(360deg);opacity:0}}
.lightning-flash{position:absolute;inset:0;background:#ffffff;opacity:0;pointer-events:none;z-index:9}
.lightning-active{animation:flashAnim 0.4s ease-out}
@keyframes flashAnim{0%{opacity:0.8}20%{opacity:0.1}40%{opacity:0.6}100%{opacity:0}}

.modal-overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#02030acc;backdrop-filter:blur(12px)}
.modal-overlay.show{display:flex}
.edit-box{width:88%;padding:18px;border-radius:16px;background:linear-gradient(145deg,#11162a,#080b16);border:1px solid #ffffff1c;box-shadow:0 20px 80px #000;text-align:center}
.edit-title{font-size:15px;font-weight:900;color:#1ed760}
.edit-subtitle{color:#7f8bad;font-size:10px;margin:4px 0 10px;line-height:1.4}
.edit-box label{display:block;margin:6px 0 3px;color:#b8c3df;font-size:10px;font-weight:700;text-align:left}
.edit-box input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #ffffff18;background:#ffffff09;color:#fff;outline:none;font-size:11px}
.edit-actions{display:flex;gap:8px;margin-top:14px}
.edit-actions button{flex:1;padding:8px;border-radius:8px;font-weight:800;font-size:10px;cursor:pointer}
.cancel{background:#ffffff0c;border:1px solid #ffffff15;color:#aab4d0}
.save{background:#1ed760;border:0;color:#000}

.dynamic-bg{position:absolute;inset:-20%;z-index:0;opacity:0;transition:opacity 0.8s ease;pointer-events:none}
.dynamic-bg.active{opacity:.85}
.dynamic-bg:before,.dynamic-bg:after{content:"";position:absolute;border-radius:50%;filter:blur(80px);transition:background 1.5s ease}
.dynamic-bg:before{width:70%;height:70%;left:-10%;top:10%;background:radial-gradient(circle, var(--c1, #00eaff88), var(--c2, #7c4dff44));animation:orb1 6s ease-in-out infinite alternate}
.dynamic-bg:after{width:65%;height:65%;right:-10%;bottom:5%;background:radial-gradient(circle, var(--c3, #ff24c488), var(--c1, #1e57ff44));animation:orb2 8s ease-in-out infinite alternate}
@keyframes orb1{0%{transform:translate(5%,5%) scale(1)}100%{transform:translate(25%,20%) scale(1.2)}}
@keyframes orb2{0%{transform:translate(-5%,-5%) scale(1)}100%{transform:translate(-20%,-15%) scale(1.15)}}

.bg-ambient-cover{
position:absolute;inset:-10%;background-size:cover;background-position:center;
filter:blur(60px) brightness(0.4);opacity:0;z-index:0;transition:opacity 1s ease, background-image 1.5s ease;
transform:scale(1.1);pointer-events:none;
}
</style>
</head>
<body>
<div class="player" id="player">
<div class="bg-ambient-cover" id="bgAmbientCover"></div>
<div class="dynamic-bg" id="dynamicBg"></div>
<div class="lightning-flash" id="lightningFlash"></div>
<div class="particle-container" id="particleContainer"></div>
<div class="grid"></div>

<div class="top">
  <div class="top-info">
    <div class="live"><i class="dot"></i> LIVE MUSIC</div>
    <div class="bpm-badge" id="bpmBadge">⚡ 120 BPM</div>
  </div>
  <div class="top-actions" id="topActions">
    <button class="badge-btn" id="bgToggleBtn">✨ FUNDO: ON</button>
    <button class="badge-btn connect-btn" id="connectNavBtn">🎧 SPOTIFY</button>
    <button class="badge-btn disconnect-btn" id="disconnectNavBtn">❌ SAIR</button>
    <button class="badge-btn" id="openConfigBtn">⚙ ID</button>
  </div>
</div>

<div class="center">
  <div class="disc-compact-wrap effect-gold" id="discWrap">
    <!-- Equalizador Circular SVG Animado -->
    <svg class="equalizer-svg" viewBox="0 0 200 200" id="eqSvg">
      <g transform="translate(100,100)" id="eqBarsGroup"></g>
    </svg>

    <div class="smoke-fog"></div>
    <div class="glow" id="glowAnim"></div>
    <div class="fire-particles"></div>
    <div class="gold-chain"></div>
    <div class="hud-scanner"></div>
    <div class="disc" id="discAnim"></div>
    <div class="album-art" id="albumArt"></div>
  </div>

  <!-- Botões de Seleção de Efeitos do Vinil Hip-Hop / Rap -->
  <div class="disc-effects-selector">
    <button class="effect-chip active" onclick="setDiscEffect('gold')">👑 OURO RAP</button>
    <button class="effect-chip" onclick="setDiscEffect('fire')">🔥 TRAP HEAT</button>
    <button class="effect-chip" onclick="setDiscEffect('cyber')">⚡ CYBER</button>
    <button class="effect-chip" onclick="setDiscEffect('glitch')">👾 DRILL GLITCH</button>
  </div>

  <!-- Caixa de Letras Sync da Música -->
  <div class="lyrics-box" id="lyricsBox">
    <div class="lyrics-title-tag">🎤 Letra ao Vivo</div>
    <div class="lyrics-content" id="lyricsContent">Aguardando música...</div>
  </div>
</div>

<div class="track">
  <div class="trackname" id="trackName">Nenhuma música tocando</div>
  <div class="artist" id="artist">Conecte sua conta do Spotify</div>

  <div class="progress"><div class="fill" id="fill"></div></div>
  <div class="times"><span id="current">00:00</span><span id="duration">00:00</span></div>
</div>

<div class="bottom">
  <button class="main-effects-btn" id="toggleEffectsBtn">✨ Menu de Efeitos Especiais</button>
  
  <div class="effects-menu" id="effectsMenu">
    <button class="anim-btn rose" onclick="triggerEffect('rose')">🌹 <span>Rosas</span></button>
    <button class="anim-btn bolt" onclick="triggerEffect('bolt')">⚡ <span>Raios</span></button>
    <button class="anim-btn money" onclick="triggerEffect('money')">💰 <span>Grana</span></button>
    <button class="anim-btn fire" onclick="triggerEffect('fire')">🔥 <span>Fogo</span></button>
  </div>
</div>
</div>

<!-- Modal Config Client ID -->
<div class="modal-overlay" id="editPanel">
  <div class="edit-box">
    <div class="edit-title">⚙ Configurar Client ID</div>
    <div class="edit-subtitle">Insira o seu <b>Client ID</b> cadastrado no Spotify Developer Dashboard.</div>
    <label>Client ID do App Spotify</label>
    <input id="clientIdInput" type="text" placeholder="Cole seu Client ID aqui">
    <div class="edit-actions">
      <button id="cancelConfig" class="cancel">Cancelar</button>
      <button id="saveClientIdBtn" class="save">Salvar</button>
    </div>
  </div>
</div>

<script>
const SCOPES = 'user-read-currently-playing user-read-playback-state';

const openConfigBtn = document.getElementById('openConfigBtn');
const editPanel = document.getElementById('editPanel');
const cancelConfig = document.getElementById('cancelConfig');
const clientIdInput = document.getElementById('clientIdInput');
const saveClientIdBtn = document.getElementById('saveClientIdBtn');

const connectNavBtn = document.getElementById('connectNavBtn');
const disconnectNavBtn = document.getElementById('disconnectNavBtn');

const bgToggleBtn = document.getElementById('bgToggleBtn');
const dynamicBg = document.getElementById('dynamicBg');
const bgAmbientCover = document.getElementById('bgAmbientCover');
const playerEl = document.getElementById('player');

const trackName = document.getElementById('trackName');
const artist = document.getElementById('artist');
const albumArt = document.getElementById('albumArt');
const fill = document.getElementById('fill');
const current = document.getElementById('current');
const duration = document.getElementById('duration');
const discWrap = document.getElementById('discWrap');
const discAnim = document.getElementById('discAnim');
const bpmBadge = document.getElementById('bpmBadge');

const lyricsContent = document.getElementById('lyricsContent');

const toggleEffectsBtn = document.getElementById('toggleEffectsBtn');
const effectsMenu = document.getElementById('effectsMenu');

toggleEffectsBtn.onclick = () => {
  effectsMenu.classList.toggle('show');
};

let currentTrackId = null;
let currentLyricsData = null; 

let localProgressMs = 0;
let isPlayingState = false;
let lastSyncTimestamp = Date.now();
let totalDurationMs = 1;

const eqBarsGroup = document.getElementById('eqBarsGroup');
const numBars = 36;
const eqBars = [];

for (let i = 0; i < numBars; i++) {
  const angle = (i / numBars) * 360;
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  const rad = (angle * Math.PI) / 180;
  
  const r1 = 82;
  const x1 = r1 * Math.cos(rad);
  const y1 = r1 * Math.sin(rad);

  line.setAttribute('x1', x1);
  line.setAttribute('y1', y1);
  line.setAttribute('x2', x1 * 1.12);
  line.setAttribute('y2', y1 * 1.12);
  line.setAttribute('stroke', '#00eaff');
  line.setAttribute('stroke-width', '2.5');
  line.setAttribute('stroke-linecap', 'round');
  line.setAttribute('opacity', '0.85');

  eqBarsGroup.appendChild(line);
  eqBars.push({ el: line, r1: r1, rad: rad });
}

function animateEqBars() {
  if (isPlayingState) {
    const time = Date.now() * (bpm / 12000);
    eqBars.forEach((bar, idx) => {
      const heightMultiplier = 1 + Math.sin(time + idx * 0.4) * 0.4 + Math.random() * 0.25;
      const r2 = bar.r1 + (14 * heightMultiplier);
      const x2 = r2 * Math.cos(bar.rad);
      const y2 = r2 * Math.sin(bar.rad);
      bar.el.setAttribute('x2', x2);
      bar.el.setAttribute('y2', y2);
    });
  }
  requestAnimationFrame(animateEqBars);
}
animateEqBars();

function setDiscEffect(effectName) {
  discWrap.classList.remove('effect-gold', 'effect-fire', 'effect-cyber', 'effect-glitch');
  discWrap.classList.add(`effect-${effectName}`);

  document.querySelectorAll('.effect-chip').forEach(chip => {
    chip.classList.remove('active');
  });

  const activeChip = Array.from(document.querySelectorAll('.effect-chip'))
    .find(c => c.textContent.toLowerCase().includes(effectName));
  if (activeChip) activeChip.classList.add('active');

  const eqColors = {
    gold: '#ffd700',
    fire: '#ff5500',
    cyber: '#00ffcc',
    glitch: '#ff007f'
  };
  const color = eqColors[effectName] || '#00eaff';
  eqBars.forEach(b => b.el.setAttribute('stroke', color));
}

let discSizePx = 140; 
const discSizes = [120, 140, 170, 200]; 
let discSizeIndex = 1;

function alterarTamanhoDisco() {
  discSizeIndex = (discSizeIndex + 1) % discSizes.length;
  discSizePx = discSizes[discSizeIndex];
  playerEl.style.setProperty('--disc-size', `${discSizePx}px`);
}

let bpm = 120;
const passoBpm = 5;
const bpmMinimo = 40;
const bpmMaximo = 300;

function alterarBpm(valor) {
  bpm = Math.min(bpmMaximo, Math.max(bpmMinimo, bpm + valor));
  bpmBadge.textContent = `⚡ ${bpm} BPM`;
  
  const duracaoBatida = (60 / bpm); 
  const duracaoRotacao = duracaoBatida * 8;
  
  discWrap.style.animationDuration = `${duracaoBatida / 2}s`;
  discAnim.style.animationDuration = `${duracaoRotacao}s`;
}
alterarBpm(0);

document.addEventListener('keydown', e => {
  if (document.activeElement.tagName === 'INPUT') return;
  const key = e.key.toLowerCase();
  
  if (key === 'l') alterarBpm(passoBpm);
  if (key === 'k') alterarBpm(-passoBpm);
  if (key === 'a') alterarTamanhoDisco(); 
  if (key === 's') document.getElementById('topActions').classList.toggle('active');
  if (key === '1') setDiscEffect('gold');
  if (key === '2') setDiscEffect('fire');
  if (key === '3') setDiscEffect('cyber');
  if (key === '4') setDiscEffect('glitch');
  if (e.key === 'F11') { e.preventDefault(); document.documentElement.requestFullscreen?.(); }
});

function updateColorsFromImage(imgUrl) {
  try {
    const img = new Image();
    img.crossOrigin = "Anonymous";
    img.src = imgUrl;
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 50; canvas.height = 50;
      ctx.drawImage(img, 0, 0, 50, 50);

      const imgData = ctx.getImageData(0, 0, 50, 50).data;
      let r1 = 0, g1 = 0, b1 = 0, count = 0;

      for (let i = 0; i < imgData.length; i += 16) {
        r1 += imgData[i]; g1 += imgData[i + 1]; b1 += imgData[i + 2]; count++;
      }
      r1 = Math.floor(r1 / count); g1 = Math.floor(g1 / count); b1 = Math.floor(b1 / count);

      let r2 = (r1 + 80) % 255, g2 = (g1 + 40) % 255, b2 = (b1 + 120) % 255;
      let r3 = (r1 + 150) % 255, g3 = (g1 + 100) % 255, b3 = (b1 + 50) % 255;

      playerEl.style.setProperty('--c1', `rgb(${r1}, ${g1}, ${b1})`);
      playerEl.style.setProperty('--c2', `rgb(${r2}, ${g2}, ${b2})`);
      playerEl.style.setProperty('--c3', `rgb(${r3}, ${g3}, ${b3})`);
    };
  } catch (e) { console.warn('Erro ao extrair cores:', e); }
}

async function fetchLyrics(trackNameStr, artistNameStr, durationMs) {
  try {
    lyricsContent.innerHTML = '<span class="lyrics-line">Buscando letra... 🎶</span>';
    const cleanTitle = trackNameStr.split('(')[0].split('-')[0].trim();
    const cleanArtist = artistNameStr.split(',')[0].trim();
    const durationSec = Math.floor(durationMs / 1000);

    const res = await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(cleanArtist)}&track_name=${encodeURIComponent(cleanTitle)}&duration=${durationSec}`);
    
    if (!res.ok) {
      currentLyricsData = null;
      lyricsContent.innerHTML = '<span class="lyrics-line">Letra não disponível para esta faixa</span>';
      return;
    }

    const data = await res.json();
    if (data && data.syncedLyrics) {
      currentLyricsData = parseLrc(data.syncedLyrics);
    } else if (data && data.plainLyrics) {
      currentLyricsData = [{ time: 0, text: data.plainLyrics }];
    } else {
      currentLyricsData = null;
      lyricsContent.innerHTML = '<span class="lyrics-line">Instrumental ou sem letra cadastrada</span>';
    }
  } catch (err) {
    currentLyricsData = null;
    lyricsContent.innerHTML = '<span class="lyrics-line">Erro ao carregar letra</span>';
  }
}

function parseLrc(lrcString) {
  const lines = lrcString.split('\n');
  const result = [];
  const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

  for (let line of lines) {
    const match = timeRegex.exec(line);
    if (match) {
      const minutes = parseInt(match[1], 10);
      const seconds = parseInt(match[2], 10);
      const milliseconds = parseInt(match[3].padEnd(3, '0'), 10);
      const timeMs = (minutes * 60 + seconds) * 1000 + milliseconds;
      const text = line.replace(timeRegex, '').trim();
      if (text) result.push({ time: timeMs, text: text });
    }
  }
  return result;
}

function updateLyricsDisplay(progressMs) {
  if (!currentLyricsData || currentLyricsData.length === 0) return;

  if (currentLyricsData.length === 1 && currentLyricsData[0].time === 0) {
    lyricsContent.innerHTML = `<div class="lyrics-line active" style="font-size:12px; white-space:pre-line;">${currentLyricsData[0].text}</div>`;
    return;
  }

  let activeIndex = 0;
  for (let i = 0; i < currentLyricsData.length; i++) {
    if (progressMs >= currentLyricsData[i].time) {
      activeIndex = i;
    } else {
      break;
    }
  }

  const prevLine = activeIndex > 0 ? currentLyricsData[activeIndex - 1].text : '';
  const currentLine = currentLyricsData[activeIndex].text;
  const nextLine = activeIndex < currentLyricsData.length - 1 ? currentLyricsData[activeIndex + 1].text : '';

  lyricsContent.innerHTML = `
    <div class="lyrics-line">${prevLine}</div>
    <div class="lyrics-line active">${currentLine}</div>
    <div class="lyrics-line">${nextLine}</div>
  `;
}

function triggerEffect(type) {
  const container = document.getElementById('particleContainer');
  if (type === 'bolt') {
    const flash = document.getElementById('lightningFlash');
    flash.classList.remove('lightning-active');
    void flash.offsetWidth;
    flash.classList.add('lightning-active');
  }

  const items = { 
    rose: ['🌹', '🌸', '🌺', '🥀'], 
    bolt: ['⚡', '🌩️', '✨'], 
    money: ['💰', '💵', '💸', '💎'],
    fire: ['🔥', '💥', '✨', '👑'] 
  };
  const selectedList = items[type] || ['✨'];
  const count = type === 'bolt' ? 18 : 24;

  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.classList.add('particle');
      el.textContent = selectedList[Math.floor(Math.random() * selectedList.length)];
      el.style.left = Math.random() * 92 + '%';
      
      const durationSec = (Math.random() * 1.8 + 1.2).toFixed(2);
      const sizePx = Math.floor(Math.random() * 14 + 18);
      
      el.style.fontSize = sizePx + 'px';
      el.style.animationDuration = durationSec + 's';
      
      container.appendChild(el);
      setTimeout(() => el.remove(), durationSec * 1000);
    }, i * 65);
  }
}

let isDynamicBgEnabled = localStorage.getItem('dynamic_bg_enabled') !== 'false';

function applyDynamicBgState() {
  if (isDynamicBgEnabled) {
    bgToggleBtn.innerHTML = '✨ FUNDO: ON';
    dynamicBg.classList.add('active');
    bgAmbientCover.classList.add('active');
  } else {
    bgToggleBtn.innerHTML = '✨ FUNDO: OFF';
    dynamicBg.classList.remove('active');
    bgAmbientCover.classList.remove('active');
  }
}

bgToggleBtn.onclick = () => {
  isDynamicBgEnabled = !isDynamicBgEnabled;
  localStorage.setItem('dynamic_bg_enabled', isDynamicBgEnabled);
  applyDynamicBgState();
};

function updateUIState() {
  const token = localStorage.getItem('spotify_access_token');
  if (token) {
    connectNavBtn.style.display = 'none';
    disconnectNavBtn.style.display = 'inline-flex';
  } else {
    connectNavBtn.style.display = 'inline-flex';
    disconnectNavBtn.style.display = 'none';
  }
}

openConfigBtn.onclick = () => {
  clientIdInput.value = localStorage.getItem('spotify_client_id') || '';
  editPanel.classList.add('show');
};
cancelConfig.onclick = () => editPanel.classList.remove('show');

saveClientIdBtn.onclick = () => {
  const clientId = clientIdInput.value.trim();
  if (!clientId) {
    const msg = document.createElement('div');
    msg.textContent = 'Insira o seu Client ID.';
    msg.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#ff315d;color:#fff;padding:8px 16px;border-radius:20px;z-index:99;font-size:12px;font-weight:700;';
    document.body.appendChild(msg);
    setTimeout(() => msg.remove(), 2500);
    return;
  }
  localStorage.setItem('spotify_client_id', clientId);
  editPanel.classList.remove('show');
};

function logoutSpotify() {
  localStorage.removeItem('spotify_access_token');
  localStorage.removeItem('spotify_refresh_token');
  localStorage.removeItem('spotify_code_verifier');

  trackName.textContent = 'Nenhuma música tocando';
  artist.textContent = 'Conecte sua conta do Spotify';
  lyricsContent.innerHTML = '<span class="lyrics-line">Aguardando música...</span>';
  albumArt.style.backgroundImage = 'none';
  bgAmbientCover.style.backgroundImage = 'none';
  fill.style.width = '0%';
  current.textContent = '00:00';
  duration.textContent = '00:00';
  currentTrackId = null;
  currentLyricsData = null;

  setPlaybackState(false);
  updateUIState();
}

disconnectNavBtn.onclick = logoutSpotify;

function generateRandomString(length) {
  let text = '';
  let possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  for (let i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
  return text;
}

async function generateCodeChallenge(codeVerifier) {
  const data = new TextEncoder().encode(codeVerifier);
  const digest = await window.crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

connectNavBtn.onclick = async () => {
  let clientId = localStorage.getItem('spotify_client_id');
  if (!clientId) { openConfigBtn.click(); return; }

  const verifier = generateRandomString(128);
  const challenge = await generateCodeChallenge(verifier);
  localStorage.setItem('spotify_code_verifier', verifier);

  const redirectUri = window.location.href.split('?')[0].split('#')[0];
  const params = new URLSearchParams({
    client_id: clientId, response_type: 'code', redirect_uri: redirectUri,
    scope: SCOPES, code_challenge_method: 'S256', code_challenge: challenge
  });

  window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
};

function fmt(ms) {
  let totalSec = Math.floor(ms / 1000);
  let m = Math.floor(totalSec / 60);
  let s = Math.floor(totalSec % 60);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function setPlaybackState(isPlaying) {
  const state = isPlaying ? 'running' : 'paused';
  discWrap.style.animationPlayState = state;
  discAnim.style.animationPlayState = state;
  const eqSvg = document.getElementById('eqSvg');
  if (eqSvg) eqSvg.style.animationPlayState = state;
}

async function handleSpotifyCallback() {
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');
  if (!code) return;

  const clientId = localStorage.getItem('spotify_client_id');
  const verifier = localStorage.getItem('spotify_code_verifier');
  const redirectUri = window.location.href.split('?')[0].split('#')[0];

  try {
    const response = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: clientId, grant_type: 'authorization_code',
        code: code, redirect_uri: redirectUri, code_verifier: verifier
      })
    });
    const data = await response.json();
    if (data.access_token) {
      localStorage.setItem('spotify_access_token', data.access_token);
      if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
      window.history.replaceState({}, document.title, redirectUri);
    }
  } catch (e) { console.error('Erro na autenticação:', e); }
}

async function refreshAccessToken() {
  const refreshToken = localStorage.getItem('spotify_refresh_token');
  const clientId = localStorage.getItem('spotify_client_id');
  if (!refreshToken || !clientId) return null;

  try {
    const response = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: clientId, grant_type: 'refresh_token', refresh_token: refreshToken
      })
    });
    const data = await response.json();
    if (data.access_token) {
      localStorage.setItem('spotify_access_token', data.access_token);
      if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
      return data.access_token;
    }
  } catch (e) { console.error('Erro ao atualizar token:', e); }
  return null;
}

async function fetchCurrentlyPlaying() {
  let token = localStorage.getItem('spotify_access_token');
  if (!token) {
    lyricsContent.innerHTML = '<span class="lyrics-line">Conecte sua conta do Spotify</span>';
    setPlaybackState(false);
    updateUIState();
    return;
  }

  updateUIState();

  try {
    let res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
      headers: { Authorization: `Bearer ${token}` }
    });

    if (res.status === 401) {
      token = await refreshAccessToken();
      if (!token) { logoutSpotify(); return; }
      res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
        headers: { Authorization: `Bearer ${token}` }
      });
    }

    if (res.status === 204 || res.status > 400) {
      trackName.textContent = 'Nenhuma música tocando';
      artist.textContent = 'Dê play no seu Spotify';
      lyricsContent.innerHTML = '<span class="lyrics-line">Aguardando reprodução...</span>';
      fill.style.width = '0%';
      current.textContent = '00:00';
      duration.textContent = '00:00';
      setPlaybackState(false);
      isPlayingState = false;
      return;
    }

    const data = await res.json();
    if (!data || !data.item) return;

    trackName.textContent = data.item.name;
    const artistStr = data.item.artists.map(a => a.name).join(', ');
    artist.textContent = artistStr + ' • Spotify';

    if (data.item.id !== currentTrackId) {
      currentTrackId = data.item.id;
      if (data.item.album && data.item.album.images.length > 0) {
        const coverUrl = data.item.album.images[0].url;
        albumArt.style.backgroundImage = `url("${coverUrl}")`;
        bgAmbientCover.style.backgroundImage = `url("${coverUrl}")`;
        updateColorsFromImage(coverUrl);
      }
      await fetchLyrics(data.item.name, artistStr, data.item.duration_ms);
    }

    localProgressMs = data.progress_ms || 0;
    isPlayingState = data.is_playing;
    lastSyncTimestamp = Date.now();
    totalDurationMs = data.item.duration_ms || 1;

    const pct = Math.min(100, (localProgressMs / totalDurationMs) * 100);
    fill.style.width = pct + '%';
    current.textContent = fmt(localProgressMs);
    duration.textContent = fmt(totalDurationMs);

    updateLyricsDisplay(localProgressMs);
    setPlaybackState(isPlayingState);

  } catch (err) { console.error('Erro ao buscar player:', err); }
}

setInterval(() => {
  if (isPlayingState) {
    const elapsed = Date.now() - lastSyncTimestamp;
    let estimatedProgress = localProgressMs + elapsed;
    
    if (estimatedProgress > totalDurationMs) {
      estimatedProgress = totalDurationMs;
    }

    current.textContent = fmt(estimatedProgress);
    const pct = Math.min(100, (estimatedProgress / totalDurationMs) * 100);
    fill.style.width = pct + '%';
    
    updateLyricsDisplay(estimatedProgress);
  }
}, 1000);

(async () => {
  applyDynamicBgState();
  await handleSpotifyCallback();
  fetchCurrentlyPlaying();
  setInterval(fetchCurrentlyPlaying, 4000);
})();
</script>
